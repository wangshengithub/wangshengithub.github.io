// ZzFXMicro - Zuper Zmall Zound Zynth

// Modifications:
//   1) Removed randomness
//   2) Added reverb

/**
 * Volume
 * @const {number}
 */
const zzfxV = 0.3;

/**
 * Generates a sound effect.
 * @param {number=} volume
 * @param {number=} randomness
 * @param {number=} frequency
 * @param {number=} attack
 * @param {number=} sustain
 * @param {number=} release
 * @param {number=} shape
 * @param {number=} shapeCurve
 * @param {number=} slide
 * @param {number=} deltaSlide
 * @param {number=} pitchJump
 * @param {number=} pitchJumpTime
 * @param {number=} repeatTime
 * @param {number=} noise
 * @param {number=} modulation
 * @param {number=} bitCrush
 * @param {number=} delay
 * @param {number=} sustainVolume
 * @param {number=} decay
 * @param {number=} tremolo
 * @return {!Array.<number>}
 */
const zzfxG = (
    volume = 1,
    randomness = .05,
    frequency = 220,
    attack = 0,
    sustain = 0,
    release = .1,
    shape = 0,
    shapeCurve = 1,
    slide = 0,
    deltaSlide = 0,
    pitchJump = 0,
    pitchJumpTime = 0,
    repeatTime = 0,
    noise = 0,
    modulation = 0,
    bitCrush = 0,
    delay = 0,
    sustainVolume = 1,
    decay = 0,
    tremolo = 0) => {

    // init parameters
    const PI2 = Math.PI*2;
    let sign = v => v>0?1:-1,
    startSlide = slide *= 500 * PI2 / zzfxR / zzfxR,
    startFrequency = frequency *= PI2 / zzfxR,
    b=[], t=0, tm=0, i=0, j=1, r=0, c=0, s=0, f, length;

    // scale by sample rate
    attack = attack * zzfxR + 9; // minimum attack to prevent pop
    decay *= zzfxR;
    sustain *= zzfxR;
    release *= zzfxR;
    delay *= zzfxR;
    deltaSlide *= 500 * PI2 / zzfxR**3;
    modulation *= PI2 / zzfxR;
    pitchJump *= PI2 / zzfxR;
    pitchJumpTime *= zzfxR;
    repeatTime = repeatTime * zzfxR | 0;

    // generate waveform
    for(length = attack + decay + sustain + release + delay | 0;
        i < length; b[i++] = s)
    {
        if (!(++c%(bitCrush*100|0)))                      // bit crush
        {
            s = shape? shape>1? shape>2? shape>3?         // wave shape
                Math.sin((t%PI2)**3) :                    // 4 noise
                Math.max(Math.min(Math.tan(t),1),-1):     // 3 tan
                1-(2*t/PI2%2+2)%2:                        // 2 saw
                1-4*Math.abs(Math.round(t/PI2)-t/PI2):    // 1 triangle
                Math.sin(t);                              // 0 sin

            s = (repeatTime ?
                    1 - tremolo + tremolo*Math.sin(PI2*i/repeatTime) // tremolo
                    : 1) *
                sign(s)*(Math.abs(s)**shapeCurve) *       // curve 0=square, 2=pointy
                volume * zzfxV * (                        // envelope
                i < attack ? i/attack :                   // attack
                i < attack + decay ?                      // decay
                1-((i-attack)/decay)*(1-sustainVolume) :  // decay falloff
                i < attack  + decay + sustain ?           // sustain
                sustainVolume :                           // sustain volume
                i < length - delay ?                      // release
                (length - i - delay)/release *            // release falloff
                sustainVolume :                           // release volume
                0);                                       // post release

            s = delay ? s/2 + (delay > i ? 0 :            // delay
                (i<length-delay? 1 : (length-i)/delay) *  // release delay
                b[i-delay|0]/2) : s;                      // sample delay
        }

        f = (frequency += slide += deltaSlide) *          // frequency
            Math.cos(modulation*tm++);                    // modulation
        t += f - f*noise*(1 - (Math.sin(i)+1)*1e9%2);     // noise

        if (j && ++j > pitchJumpTime)       // pitch jump
        {
            frequency += pitchJump;         // apply pitch jump
            startFrequency += pitchJump;    // also apply to start
            j = 0;                          // stop pitch jump time
        }

        if (repeatTime && !(++r % repeatTime)) // repeat
        {
            frequency = startFrequency;     // reset frequency
            slide = startSlide;             // reset slide
            j = j || 1;                     // reset pitch jump time
        }
    }

    return b;
};

/**
 * Plays a sound.
 * @param {...!Array.<number>} t
 * @return {!AudioBufferSourceNode}
 */
const zzfxP = (...t) => {
  const e = zzfxX.createBufferSource();
  const f = zzfxX.createBuffer(t.length, t[0].length, zzfxR);
  t.map((d, i) => f.getChannelData(i).set(d));
  e.buffer = f;
  e.connect(zzfxX.destination);
  e.connect(reverbConvolver);
  e.start();
  return e;
};

/**
 * Generates and plays a sound effect.
 * @param {...*} t
 * @return {!AudioBufferSourceNode}
 */
const zzfx = (...t) => zzfxP(zzfxG(...t));

/**
 * Audio context.
 * @const {!AudioContext}
 */
const zzfxX = new AudioContext();

/**
 * Sample rate.
 * @const {number}
 */
const zzfxR = 44100;

/**
 * Creates a reverb convolver.
 * @param {number} duration Duration in seconds.
 * @returns {!ConvolverNode} The reverb convolver.
 */
function createReverbConvolver(duration) {
  const sampleRate = zzfxX.sampleRate;
  const length = sampleRate * duration;
  const impulse = zzfxX.createBuffer(2, length, sampleRate);
  const impulseL = impulse.getChannelData(0);
  const impulseR = impulse.getChannelData(1);
  const decay = 1.5;

  for (let i = 0; i < length; i++){
    impulseL[i] = 0.5 * (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
    impulseR[i] = 0.5 * (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
  }

  const convolver = zzfxX.createConvolver();
  convolver.buffer = impulse;
  convolver.connect(zzfxX.destination);
  return convolver;
}

/**
 * The reverb convolver.
 * @const {!ConvolverNode}
 */
const reverbConvolver = createReverbConvolver(1);

/**
 * ZzFX Music Renderer v2.0.3 by Keith Clark and Frank Force
 */

/** @typedef {!Array.<number>} */
const Channel = {};

/** @typedef {!Array.<!Channel>} */
const Pattern = {};

/** @typedef {!Array.<number>} */
const Instrument = {};

/**
 * Converts a boolean to integer.
 * Technically, just using a boolean should do this automatically.
 * However...
 * 1) Google Closure does not accept it.
 * 2) It is apparently very slow.
 * @param {boolean} b
 * @return {number}
 */
const boolToInt = (b) => b ? 1 : 0;

/**
 * Generate a song
 *
 * @param {!Array.<!Instrument>} instruments - Array of ZzFX sound paramaters.
 * @param {!Array.<!Pattern>} patterns - Array of pattern data.
 * @param {!Array.<number>} sequence - Array of pattern indexes.
 * @param {number=} BPM - Playback speed of the song (in BPM).
 * @return {!Array.<!Array.<number>>} Left and right channel sample data.
 */
const zzfxM = (instruments, patterns, sequence, BPM = 125) => {
  let instrumentParameters;
  let i;
  let j;
  let k;
  let note;
  let sample;
  let patternChannel;
  let notFirstBeat;
  let stop;
  let instrument;
  let attenuation;
  let outSampleOffset;
  let isSequenceEnd;
  let sampleOffset = 0;
  let nextSampleOffset;
  let sampleBuffer = [];
  const leftChannelBuffer = [];
  const rightChannelBuffer = [];
  let channelIndex = 0;
  let panning = 0;
  let hasMore = 1;
  const sampleCache = {};
  const beatLength = zzfxR / BPM * 60 >> 2;

  // for each channel in order until there are no more
  for (; hasMore; channelIndex++) {
    // reset current values
    sampleBuffer = [hasMore = notFirstBeat = outSampleOffset = 0];

    // for each pattern in sequence
    sequence.map((patternIndex, sequenceIndex) => {
      // get pattern for current channel, use empty 1 note pattern if none found
      patternChannel = patterns[patternIndex][channelIndex] || [0, 0, 0];

      // check if there are more channels
      hasMore |= boolToInt(!!patterns[patternIndex][channelIndex]);

      // get next offset, use the length of first channel
      nextSampleOffset = outSampleOffset +
        (patterns[patternIndex][0].length - 2 - boolToInt(!notFirstBeat)) * beatLength;

      // for each beat in pattern, plus one extra if end of sequence
      isSequenceEnd = sequenceIndex == sequence.length - 1;
      for (i = 2, k = outSampleOffset; i < patternChannel.length + isSequenceEnd; notFirstBeat = ++i) {
        // <channel-note>
        note = patternChannel[i];

        // stop if end, different instrument or new note
        stop = i == patternChannel.length + isSequenceEnd - 1 && isSequenceEnd ||
          boolToInt(instrument != (patternChannel[0] || 0)) | note | 0;

        // fill buffer with samples for previous beat, most cpu intensive part
        j = 0;
        while (j < beatLength && notFirstBeat) {
          // copy sample to stereo buffers with panning
          sample = (1 - attenuation) * sampleBuffer[sampleOffset++] / 2 || 0;
          leftChannelBuffer[k] = (leftChannelBuffer[k] || 0) - sample * panning + sample;
          rightChannelBuffer[k] = (rightChannelBuffer[k++] || 0) + sample * panning + sample;
          if (j++ > beatLength - 99 && stop) {
            attenuation += boolToInt(attenuation < 1) / 99;
          }
        }

        // set up for next note
        if (note) {
          // set attenuation
          attenuation = note % 1;
          panning = patternChannel[1] || 0;
          if (note |= 0) {
            // get cached sample
            sampleBuffer = sampleCache[
                [
                  instrument = patternChannel[sampleOffset = 0] || 0,
                  note,
                ]
            ] = sampleCache[[instrument, note]] || (
              // add sample to cache
              instrumentParameters = [...instruments[instrument]],
              instrumentParameters[2] *= 2 ** ((note - 12) / 12),

              // allow negative values to stop notes
              note > 0 ? zzfxG(...instrumentParameters) : []
            );
          }
        }
      }

      // update the sample offset
      outSampleOffset = nextSampleOffset;
    });
  }

  return [leftChannelBuffer, rightChannelBuffer];
};

/**
* Reference to background music currently playing.
* Null if no music playing.
* @type {?AudioBufferSourceNode}
*/
let backgroundMusicNode = null;

/**
* Plays the music.
* @param {!Array} songData The song data.
* @param {boolean=} loop Flag to loop the song continuously.
*/
const playMusic = (songData, loop) => {
  const buffer = zzfxM(...songData); // Generate the sample data
  const node = zzfxP(...buffer); // Play the song
  if (loop) {
    stopBackgroundMusic();
    node.loop = true;
    backgroundMusicNode = node;
  }
};

/**
* Stops current background music.
*/
const stopBackgroundMusic = () => {
  if (backgroundMusicNode) {
    backgroundMusicNode.stop();
    backgroundMusicNode = null;
  }
};

/**
 * Returns whether background music is currently playing.
 * Used to pick the speaker glyph on the touch control.
 * @return {boolean}
 */
const backgroundMusicEnabled = () => !!backgroundMusicNode;

/**
 * Returns whether the player has muted music in a previous session.
 * @return {boolean}
 */
const musicMutedByPreference = () => readStore('music-off') !== null;

/**
 * Toggles background music.
 * If playing, stops.
 * If not, starts.
 */
const toggleBackgroundMusic = () => {
  if (backgroundMusicNode) {
    stopBackgroundMusic();
    writeStore('music-off', 't');
  } else {
    playMusic(milkyWaySong, true);
    try {
      localStorage.removeItem('music-off');
    } catch (e) {
      // Storage unavailable; the preference just will not persist.
    }
  }
};

// ===== levels.js =====

// Level progression, objectives and difficulty model.
//
// Upstream shipped 10 hand-built levels in authoring order, with three
// structural problems:
//
//  1. The curve was not monotonic. The original level 3 ("Lotsa Lifts") is a
//     precision timing gauntlet across seven out-of-phase moving lifts, placed
//     before the player had met a single projectile; the original level 7
//     introduced missiles far later on flat, safe ground. New players hit a wall
//     on level 3 and quit before seeing the gentler content behind it.
//  2. Mechanics were never taught in isolation. Jetpack flight is *required* to
//     finish "Four Corners", but nothing before it teaches the jetpack, and the
//     level punishes failure with a fatal fall.
//  3. The exit was silently locked. The transporter only responded once every
//     single coin was collected, with no message explaining why. A player who
//     missed one coin walked onto the goal, saw nothing happen, and concluded
//     the game was broken.
//
// This file addresses all three: levels are ordered by a computed difficulty
// score, each level declares the mechanic it introduces (driving the tutorial
// prompts), and the exit states its requirement out loud.

/**
 * Number of playable levels (excluding the intro cinematic and the credits).
 * @const {number}
 */
const LEVEL_COUNT = 12;

/**
 * Fraction of a level's stars needed to open the transporter.
 *
 * 1.0 keeps upstream's rule: every pickup on the level. What upstream got wrong
 * was not the rule but the silence - the transporter simply ignored the player
 * with no explanation. That part stays fixed: the HUD shows the outstanding count
 * continuously, so a locked exit is always self-explanatory.
 *
 * Lower this to make the exit open early; the HUD text and the star tiers below
 * both follow automatically.
 * @const {number}
 */
const REQUIRED_STAR_FRACTION = 1.0;

/**
 * Multiple of a level's par time that still earns 2 stars.
 * @const {number}
 */
const TWO_STAR_PAR_MULTIPLE = 1.6;

/**
 * Level metadata, in play order.
 *
 * `teaches` lists mechanics introduced here for the first time; tutorial.js
 * turns them into on-screen prompts. `par` is the 3-star target time in seconds.
 * `build` names the geometry builder in mapgen.js.
 *
 * `fallsFatal` is a factual property of the geometry, not a difficulty opinion:
 * false means the builder walls the arena in or puts a catch floor under it, so
 * a missed jump costs seconds instead of the run. Verify it by reading the
 * builder - the two teaching levels call encloseArena().
 * @const {!Array.<!Object>}
 */
const LEVELS = [
  {nameKey: 'nmFirstSteps', build: 'firstSteps', teaches: ['move', 'jump', 'collect', 'goal'], par: 40, fallsFatal: false},
  {nameKey: 'nmHighRoad', build: 'highRoad', teaches: ['alien'], par: 60, fallsFatal: true},
  {nameKey: 'nmJetpackTraining', build: 'jetpackTraining', teaches: ['jetpack', 'fuel'], par: 60, fallsFatal: false},
  {nameKey: 'nmFirstContact', build: 'firstContact', teaches: ['lift'], par: 55, fallsFatal: true},
  {nameKey: 'nmFourCorners', build: 'fourCorners', teaches: [], par: 75, fallsFatal: true},
  {nameKey: 'nmFiringSquad', build: 'firingSquad', teaches: ['shooter'], par: 55, fallsFatal: true},
  {nameKey: 'nmMoatAndCastle', build: 'moatAndCastle', teaches: [], par: 95, fallsFatal: true},
  {nameKey: 'nmLotsaLifts', build: 'lotsaLifts', teaches: [], par: 70, fallsFatal: true},
  {nameKey: 'nmThePit', build: 'thePit', teaches: ['aggro'], par: 70, fallsFatal: true},
  {nameKey: 'nmSpiresOfKodos', build: 'spiresOfKodos', teaches: [], par: 120, fallsFatal: true},
  {nameKey: 'nmGreatPyramid', build: 'greatPyramid', teaches: [], par: 100, fallsFatal: true},
  {nameKey: 'nmInnerSanctum', build: 'innerSanctum', teaches: ['boss'], par: 150, fallsFatal: true},
];

/**
 * Weights for the difficulty model.
 *
 * These are the factors that actually kill players in this game. The score is
 * only meaningful as an ordering, not as an absolute number - its job is to make
 * "is level N harder than level N-1?" a question with a checkable answer instead
 * of a matter of taste. tools/difficulty.mjs asserts the ordering is monotonic.
 * @const {!Object.<string,number>}
 */
const DIFFICULTY_WEIGHTS = {
  patrolAlien: 1.0, // Fixed-route alien: learnable, low threat.
  chaseAlien: 2.5, // Non-zero aggroRange: actively hunts the player.
  shooter: 2.0, // Fires projectiles on a timer.
  boss: 8.0, // Kang.
  island: 1.5, // Each *disconnected* group of solid ground is a gap to cross.
  lift: 1.0, // Moving platform: demands timing.
  liftReliance: 8.0, // Scales with how much of the route is moving platforms.
  verticalSpan: 0.3, // Per metre of height range: a longer fall is a worse one.
  fuelDependency: 2.0, // Level needs jetpack fuel management.
};

/**
 * Groups static platforms into connected clusters ("islands").
 *
 * The count of *platforms* is a bad proxy for fall risk, because a staircase is
 * built from a dozen touching blocks that the player walks up as one surface -
 * scoring that as a dozen hazards ranked "Moat and Castle" as the hardest level
 * in the game. What matters is how many separate pieces of ground there are, so
 * this unions any two platforms whose bounding boxes touch.
 * @param {!Array.<!Platform>} platforms
 * @return {number}
 */
function countGroundIslands(platforms) {
  const parent = platforms.map((unused, i) => i);
  const find = (i) => {
    while (parent[i] !== i) {
      parent[i] = parent[parent[i]];
      i = parent[i];
    }
    return i;
  };
  const union = (a, b) => {
    const ra = find(a);
    const rb = find(b);
    if (ra !== rb) {
      parent[rb] = ra;
    }
  };

  // Touching, not merely near: half a metre of slack absorbs the fractional
  // heights the stair builders use.
  const slack = 0.5;
  const overlaps = (a, b, axis) =>
    a.pos[axis] - a.scale[axis] - slack <= b.pos[axis] + b.scale[axis] &&
    b.pos[axis] - b.scale[axis] - slack <= a.pos[axis] + a.scale[axis];

  for (let i = 0; i < platforms.length; i++) {
    for (let j = i + 1; j < platforms.length; j++) {
      const a = platforms[i];
      const b = platforms[j];
      if (overlaps(a, b, 0) && overlaps(a, b, 1) && overlaps(a, b, 2)) {
        union(i, j);
      }
    }
  }

  const roots = new Set();
  for (let i = 0; i < platforms.length; i++) {
    roots.add(find(i));
  }
  return roots.size;
}

/**
 * Computes a difficulty score for a built level from its entity list.
 *
 * This encodes a model of what actually kills players here: enemy contact, gaps
 * between separate pieces of ground, dependence on moving platforms, fall height,
 * and fuel pressure. It is a heuristic ordering aid, not a spec - its job is to
 * make gross inversions (the original level 3 being harder than level 8)
 * impossible to ship unnoticed. tools/difficulty.mjs checks it.
 *
 * Pure function of its inputs, so the game and the offline checker agree.
 * @param {!Array.<!GameEntity>} built
 * @param {boolean=} fallsFatal False when the arena is walled or has a catch
 *     floor, which removes most of the risk that gaps and height would imply.
 * @return {number}
 */
function computeLevelDifficulty(built, fallsFatal = true) {
  let score = 0;
  let minY = Infinity;
  let maxY = -Infinity;
  let lifts = 0;
  let hasFuel = false;
  const statics = [];

  for (const e of built) {
    if (e instanceof Platform) {
      const top = e.pos[1] + e.scale[1];
      minY = Math.min(minY, top);
      maxY = Math.max(maxY, top);
      if (e.waypoints && e.waypoints.length > 0) {
        lifts++;
      } else {
        statics.push(e);
      }
    } else if (e instanceof Kang) {
      score += DIFFICULTY_WEIGHTS.boss;
    } else if (e instanceof Shooter) {
      score += DIFFICULTY_WEIGHTS.shooter;
    } else if (e instanceof Alien) {
      score += e.aggroRange > 0 ?
        DIFFICULTY_WEIGHTS.chaseAlien :
        DIFFICULTY_WEIGHTS.patrolAlien;
    } else if (e instanceof Fuel) {
      hasFuel = true;
    }
  }

  // Gaps and height only threaten the player when a fall actually ends the run.
  // Without this the two walled teaching levels scored as mid-game content
  // purely because they are tall, which is exactly backwards.
  const fallFactor = fallsFatal ? 1 : 0.15;

  const islands = countGroundIslands(statics);
  score += islands * DIFFICULTY_WEIGHTS.island * fallFactor;
  score += lifts * DIFFICULTY_WEIGHTS.lift;

  // A level where most of the route is moving platforms is a timing gauntlet -
  // this is what makes "Lotsa Lifts" hard despite containing almost nothing.
  if (lifts + islands > 0) {
    score += DIFFICULTY_WEIGHTS.liftReliance * fallFactor * lifts / (lifts + islands);
  }

  if (maxY > minY) {
    score += (maxY - minY) * DIFFICULTY_WEIGHTS.verticalSpan * fallFactor;
  }
  if (hasFuel) {
    score += DIFFICULTY_WEIGHTS.fuelDependency;
  }
  return score;
}

/**
 * Highest level the player has unlocked (1-based).
 * @type {number}
 */
let unlockedLevel = 1;

/**
 * Best completion time per level, indexed by level number.
 * @const {!Array.<number>}
 */
let bestTimes = [];

/**
 * Best star rating per level (0-3), indexed by level number.
 * @const {!Array.<number>}
 */
let bestStars = [];

/**
 * Consecutive deaths on the current level, used to offer a skip so a single
 * hard level cannot end a play session.
 * @type {number}
 */
let levelDeaths = 0;

/**
 * Deaths before the skip option appears.
 * @const {number}
 */
const DEATHS_BEFORE_SKIP = 4;

/**
 * Loads persisted progress. Tolerates absent or corrupt storage.
 */
function loadProgress() {
  bestTimes = parseStoredArray('callisto-times');
  bestStars = parseStoredArray('callisto-stars');
  const u = parseInt(readStore('callisto-unlocked') || '1', 10);
  unlockedLevel = Number.isFinite(u) ? Math.min(Math.max(u, 1), LEVEL_COUNT) : 1;
}

/**
 * Reads and parses a JSON array from storage.
 * @param {string} key
 * @return {!Array.<number>}
 */
function parseStoredArray(key) {
  const raw = readStore(key);
  if (!raw) {
    return [];
  }
  try {
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}

/**
 * Persists progress.
 */
function saveProgress() {
  writeStore('callisto-times', JSON.stringify(bestTimes));
  writeStore('callisto-stars', JSON.stringify(bestStars));
  writeStore('callisto-unlocked', String(unlockedLevel));
}

/**
 * Returns metadata for a level number (1-based), or null when out of range.
 * @param {number} n
 * @return {?Object}
 */
const levelInfo = (n) => LEVELS[n - 1] || null;

/**
 * Returns the localized display name for a level number.
 * @param {number} n
 * @return {string}
 */
const levelName = (n) => {
  const info = levelInfo(n);
  return info ? t(info.nameKey) : t('level', n);
};

/**
 * Returns true if the level is unlocked and therefore selectable.
 * @param {number} n
 * @return {boolean}
 */
const isLevelUnlocked = (n) => n <= unlockedLevel;

/**
 * Number of stars required to open the transporter on the current level.
 * @return {number}
 */
const requiredCoins = () => Math.ceil(availableCoins * REQUIRED_STAR_FRACTION);

/**
 * Rates a completed level from 1 to 3 stars.
 *
 * With REQUIRED_STAR_FRACTION at 1.0 the exit already demands every pickup, so
 * "collected everything" cannot distinguish runs - it is true of every finish.
 * Time is the only variable left, and it carries the tiers:
 *
 *   3 = within par, 2 = within TWO_STAR_PAR_MULTIPLE x par, 1 = slower.
 *
 * The collection check is kept ahead of the time tiers rather than deleted, so
 * this stays correct if the fraction is ever lowered again: a partial-collection
 * finish then scores 1 star regardless of how fast it was.
 * @param {number} n
 * @param {number} collected
 * @param {number} total
 * @param {number} seconds
 * @return {number}
 */
function rateLevel(n, collected, total, seconds) {
  const info = levelInfo(n);
  if (total > 0 && collected < total) {
    return 1;
  }
  if (!info) {
    return 2;
  }
  if (seconds <= info.par) {
    return 3;
  }
  return seconds <= info.par * TWO_STAR_PAR_MULTIPLE ? 2 : 1;
}

/**
 * Records a level completion and unlocks the next one.
 * @param {number} n
 * @param {number} collected
 * @param {number} total
 * @param {number} seconds
 * @return {number} Stars awarded for this run.
 */
function completeLevel(n, collected, total, seconds) {
  const stars = rateLevel(n, collected, total, seconds);
  bestTimes[n] = bestTimes[n] ? Math.min(bestTimes[n], seconds) : seconds;
  bestStars[n] = Math.max(bestStars[n] || 0, stars);
  unlockedLevel = Math.min(Math.max(unlockedLevel, n + 1), LEVEL_COUNT);
  levelDeaths = 0;
  saveProgress();
  return stars;
}

/**
 * Whether the player should be offered a skip on the current level.
 * @return {boolean}
 */
const canSkipLevel = () => levelDeaths >= DEATHS_BEFORE_SKIP;

/**
 * Unlocks the next level without a win, for the repeated-death escape hatch.
 * @param {number} n
 */
function grantSkip(n) {
  unlockedLevel = Math.min(Math.max(unlockedLevel, n + 1), LEVEL_COUNT);
  levelDeaths = 0;
  saveProgress();
}

loadProgress();

// ===== tutorial.js =====

// Staged, contextual tutorial.
//
// Upstream taught the player by printing two lines of prose on the level intro
// screen and then never mentioning controls again except as a permanent block of
// fifteen keyboard icons in the corner of the HUD. That fails three ways: it
// requires reading English, it front-loads everything before the player has any
// context, and the icon block is meaningless on a phone.
//
// Instead each level declares the mechanic it introduces (see levels.js) and
// this file turns that into one prompt at a time, shown during play, phrased
// against whatever device the player is actually using, and dismissed
// automatically when the player demonstrates the skill. Nothing to read ahead of
// time and nothing to dismiss manually.

/**
 * How long an informational prompt stays up, in seconds.
 * @const {number}
 */
const INFO_PROMPT_TIME = 4.5;

/**
 * How long the "done" flash lasts after a step is satisfied, in seconds.
 * @const {number}
 */
const DONE_FLASH_TIME = 1.0;

/**
 * Distance the player must travel to satisfy the "move" step, in metres.
 * @const {number}
 */
const MOVE_STEP_DISTANCE = 7;

/**
 * Seconds of jetpack thrust required to satisfy the "jetpack" step.
 * @const {number}
 */
const JETPACK_STEP_TIME = 0.6;

/**
 * Queue of mechanic ids still to be taught on this level.
 * @type {!Array.<string>}
 */
let tutorialQueue = [];

/**
 * Mechanic currently being prompted, or null when nothing is showing.
 * @type {?string}
 */
let tutorialStep = null;

/**
 * Game time the current step started.
 * @type {number}
 */
let tutorialStepStart = 0;

/**
 * Game time the current step was satisfied, or -1 while still pending.
 * @type {number}
 */
let tutorialDoneTime = -1;

/**
 * Player spawn position for this level, used by the "move" step.
 * @const {!vec3}
 */
const tutorialSpawn = vec3.create();

/**
 * Whether the player has left the ground under their own power this level.
 * @type {boolean}
 */
let tutorialHasJumped = false;

/**
 * Accumulated jetpack thrust time this level, in seconds.
 * @type {number}
 */
let tutorialJetpackTime = 0;

/**
 * Mechanics that are informational only - there is no action to perform, so they
 * time out instead of waiting for the player to do something.
 * @const {!Set.<string>}
 */
const INFO_STEPS = new Set(['lift', 'alien', 'aggro', 'shooter', 'boss', 'fuel']);

/**
 * Maps a mechanic id to its localized prompt, filling in a control glyph where
 * the prompt names one.
 * @param {string} step
 * @return {string}
 */
function tutorialText(step) {
  switch (step) {
    case 'move': return t('tutMove', controlGlyph('move'));
    case 'jump': return t('tutJump', controlGlyph('jump'));
    case 'jetpack': return t('tutJetpack', controlGlyph('jetpack'));
    case 'collect': return t('tutCollect');
    case 'goal': return t('tutGoal');
    case 'fuel': return t('tutFuel');
    case 'lift': return t('tutLift');
    case 'alien': return t('tutAlien');
    case 'aggro': return t('tutAggro');
    case 'shooter': return t('tutShooter');
    case 'boss': return t('tutBoss');
    default: return '';
  }
}

/**
 * Returns a short label for a control, matching the device in use.
 *
 * On touch the on-screen buttons are the truth, so the prompt points at them
 * rather than naming keys the player does not have.
 * @param {string} action
 * @return {string}
 */
function controlGlyph(action) {
  if (touchMode) {
    switch (action) {
      case 'move': return '🕹';
      case 'jump': return '⤒';
      case 'jetpack': return '🚀';
      default: return '';
    }
  }
  switch (action) {
    case 'move': return 'WASD';
    case 'jump': return 'SPACE';
    case 'jetpack': return 'SHIFT';
    default: return '';
  }
}

/**
 * Starts the tutorial queue for a level.
 * @param {number} n Level number (1-based).
 */
function resetTutorial(n) {
  const info = levelInfo(n);
  tutorialQueue = info ? info.teaches.slice() : [];
  tutorialStep = null;
  tutorialDoneTime = -1;
  tutorialHasJumped = false;
  tutorialJetpackTime = 0;
  vec3.copy(tutorialSpawn, player.pos);
  advanceTutorial();
}

/**
 * Pops the next mechanic off the queue.
 */
function advanceTutorial() {
  tutorialStep = tutorialQueue.shift() || null;
  tutorialStepStart = gameTime;
  tutorialDoneTime = -1;
}

/**
 * Records that the player jumped. Called from the jump path in index.js.
 */
function noteTutorialJump() {
  tutorialHasJumped = true;
}

/**
 * Returns whether the current step's goal has been met.
 * @return {boolean}
 */
function tutorialStepSatisfied() {
  switch (tutorialStep) {
    case 'move':
      return vec3.distance(player.pos, tutorialSpawn) > MOVE_STEP_DISTANCE;
    case 'jump':
      return tutorialHasJumped;
    case 'collect':
      return coins > 0;
    case 'jetpack':
      return tutorialJetpackTime > JETPACK_STEP_TIME;
    case 'goal':
      // Held until the level ends; the transporter itself is the completion.
      return false;
    default:
      // Informational steps clear on a timer.
      return gameTime - tutorialStepStart > INFO_PROMPT_TIME;
  }
}

/**
 * Advances tutorial state. Call once per frame while playing.
 */
function updateTutorial() {
  if (player.jetpack) {
    tutorialJetpackTime += dt;
  }

  if (!tutorialStep) {
    return;
  }

  if (tutorialDoneTime >= 0) {
    if (gameTime - tutorialDoneTime > DONE_FLASH_TIME) {
      advanceTutorial();
    }
    return;
  }

  if (tutorialStepSatisfied()) {
    // Informational steps just disappear; skill steps get a confirmation flash
    // so the player knows *that specific thing* is what they just did right.
    tutorialDoneTime = INFO_STEPS.has(tutorialStep) ? gameTime - DONE_FLASH_TIME : gameTime;
  }
}

/**
 * Draws the active tutorial prompt, if any.
 */
function drawTutorialPrompt() {
  if (!tutorialStep) {
    return;
  }

  const text = tutorialText(tutorialStep);
  if (!text) {
    return;
  }

  const satisfied = tutorialDoneTime >= 0;
  const age = gameTime - tutorialStepStart;

  // Fade in quickly, and fade out during the confirmation flash.
  let alpha = Math.min(1, age * 4);
  if (satisfied) {
    alpha = Math.max(0, 1 - (gameTime - tutorialDoneTime) / DONE_FLASH_TIME);
  }
  if (alpha <= 0) {
    return;
  }

  const prevAlpha = overlayCtx.globalAlpha;
  overlayCtx.globalAlpha = alpha;

  setTextAlign(ALIGN_CENTER);
  setFontSize(44, 'italic');
  const label = satisfied ? '✓ ' + text : text;
  const width = Math.min(WIDTH - 120, overlayCtx.measureText(label).width + 80);

  drawRectangle(CENTER_X - width / 2, 176, width, 74, 'rgba(0,0,0,0.55)',
      satisfied ? OVERLAY_GREEN : OVERLAY_YELLOW);
  drawShadowText(label, CENTER_X, 190, satisfied ? OVERLAY_GREEN : OVERLAY_WHITE);

  overlayCtx.globalAlpha = prevAlpha;
}

// ===== hud.js =====

/**
 * How many levels keep showing the keyboard cheat sheet.
 *
 * Upstream drew fifteen key icons in the corner for the entire game. That is
 * visual noise for anyone past level 1, and completely wrong on a phone where
 * none of those keys exist. Now it appears only while the player is plausibly
 * still learning, and only on a keyboard.
 * @const {number}
 */
const HINT_LEVELS = 3;

/**
 * Draws the star / fuel / timer readouts plus whichever control hints suit the
 * current device.
 */
function drawHud() {
  if (gameState === GameState.CREDITS) {
    setTextAlign(ALIGN_CENTER);
    setFontSize(24, 'italic');
    drawShadowText(t('titlePre'), CENTER_X, 60);
    setFontSize(64, 'italic');
    drawShadowText(t('titleMain'), CENTER_X, 120);

    drawFittedText(t('thanks'), CENTER_X, CENTER_Y, WIDTH - 160, 72, 'italic');
    return;
  }

  setFontSize(48);
  setTextAlign(ALIGN_LEFT);

  // Show the requirement, not just the tally. The old HUD printed "3 / 8" and
  // left the player to guess that the exit silently needed all eight.
  const need = requiredCoins();
  const met = coins >= need;
  drawShadowText('⭐ ' + coins + ' / ' + availableCoins, 20, 20,
      met ? OVERLAY_GREEN : OVERLAY_YELLOW);
  if (!met) {
    setFontSize(28);
    drawShadowText(t('needStars', need - coins), 20, 74, OVERLAY_LIGHT_GRAY);
  }

  setFontSize(48);
  drawShadowText('🚀 ' + player.fuel.toFixed(0) + '%', 20, 112);

  setTextAlign(ALIGN_RIGHT);
  drawShadowText(gameTime.toFixed(1), WIDTH - 20, 20, OVERLAY_LIGHT_GRAY);

  const best = bestTimes[level];
  if (best) {
    setFontSize(26);
    drawShadowText(t('best') + ' ' + best.toFixed(1), WIDTH - 20, 76, OVERLAY_LIGHT_GRAY);
  }

  drawTutorialPrompt();
  drawTouchControls();

  if (canSkipLevel() && !touchMode) {
    setTextAlign(ALIGN_CENTER);
    setFontSize(26, 'italic');
    drawShadowText(t('skipOffer', 'N'), CENTER_X, HEIGHT - 46, OVERLAY_ORANGE);
  }

  if (!touchMode && level <= HINT_LEVELS) {
    drawKeyboardHints();
  }
}

  drawKeyIcon('D', WIDTH - 400, HEIGHT - 325);
  drawKeyIcon('⬆', WIDTH - 295, HEIGHT - 370);
  drawKeyIcon('⬅', WIDTH - 340, HEIGHT - 325);
  drawKeyIcon('⬇', WIDTH - 295, HEIGHT - 325);
  drawKeyIcon('➡', WIDTH - 250, HEIGHT - 325);
  drawKeyIcon('SPACE', WIDTH - 327, HEIGHT - 270, 100);
  drawKeyIcon('Z', WIDTH - 250, HEIGHT - 270);
  drawKeyIcon('SHIFT', WIDTH - 327, HEIGHT - 215, 100);

  drawKeyIcon('R', WIDTH - 250, HEIGHT - 160);

  setTextAlign(ALIGN_LEFT);
  drawFittedText(t('move'), WIDTH - 210, HEIGHT - 315, 195, 24, '', OVERLAY_LIGHT_GRAY);
  drawFittedText(t('jump'), WIDTH - 210, HEIGHT - 270, 195, 24, '', OVERLAY_LIGHT_GRAY);
  drawFittedText(t('jetpack'), WIDTH - 210, HEIGHT - 215, 195, 24, '', OVERLAY_LIGHT_GRAY);

  drawFittedText(t('menu'), WIDTH - 210, HEIGHT - 50, 195, 24, '', OVERLAY_LIGHT_GRAY);
}

// ===== menu.js =====

// Menus.
//
// All strings moved to i18n.js, and every screen now accepts a tap as well as a
// key. The introText table that used to live here is gone: story lines are
// localized entries, and per-level prose was replaced by the level's own name
// plus the contextual tutorial prompts in tutorial.js.

/**
 * @typedef {{
  *            callback:!Function
  *          }}
  */
let Menu;

/**
 * Level intro screen.
 * @return {!Menu}
 */
const levelIntro = () => ({
  callback: () => {
    gameState = GameState.PLAYING;
    gameTime = 0;
    setMenu(null);
  },
});

/**
 * Death screen.
 * @const {!Menu}
 */
const deathScreen = {
  callback: () => {
    gameState = GameState.BEFORE_LEVEL;
    showLevelIntro();
  },
};

/**
 * Win screen.
 * @const {!Menu}
 */
const winScreen = {
  callback: () => {
    gameState = GameState.BEFORE_LEVEL;
    setLevel(level + 1);
    showLevelIntro();
  },
};

/**
 * Opening screen to get player input.
 * @const {!Menu}
 */
const clickToStart = {
  callback: () => {
    if (gameState === 0) {
      zzfxX.resume();
      if (!musicMutedByPreference()) {
        playMusic(milkyWaySong, true);
      }
    }
    if (++gameState > GameState.INTRO_STORY2) {
      setLevel(1);
      showLevelIntro();
    }
  },
};

/**
 * Main menu.
 * @const {!Menu}
 */
const mainMenu = {
  callback: () => {
    log('main menu callback');
  },
};

/**
 * Level select menu.
 * @const {!Menu}
 */
const levelsMenu = {
  callback: () => {
    log('levels menu callback');
  },
};

/**
 * Real world time that the menu started, in seconds.
 * Menus wait briefly before accepting a continue, so one press cannot skip two
 * screens.
 * @type {number}
 */
let menuStartTime = 0;

/**
 * Currently active menu.
 * @type {?Menu}
 */
let menu = clickToStart;

/**
 * Previous menu, if any.
 * @type {?Menu}
 */
let prevMenu = null;

/**
 * Current menu option.
 * @type {number}
 */
let menuY = 0;

/**
 * Stars awarded for the run that just finished, shown on the win screen.
 * @type {number}
 */
let lastRunStars = 0;

/**
 * Sets or clears the current menu.
 * @param {?Menu} m
 */
function setMenu(m) {
  prevMenu = menu;
  menuStartTime = time;
  menu = m;
  menuY = 0;
  clearPendingTap();
  clearConfirm();
  releaseTouchControls();
}

/**
 * Re-initializes the game and shows the level intro screen.
 */
function showLevelIntro() {
  initGame();
  setMenu(levelIntro());
}

/**
 * Opens the pause / main menu. Used by the ESC key and the touch pause button.
 */
function requestPauseMenu() {
  if (menu === mainMenu) {
    return;
  }
  resetKeys();
  setMenu(mainMenu);
  playMenuBeep();
}

/**
 * Renders a star rating, filled then hollow.
 * @param {number} stars
 * @return {string}
 */
const starGlyphs = (stars) => '★'.repeat(stars) + '☆'.repeat(Math.max(0, 3 - stars));

/**
 * Draws one selectable menu row and reports whether it was tapped.
 *
 * Registering the tap target in the same call that paints the label keeps the
 * two from drifting apart, which matters now that menus must work by touch as
 * well as by keyboard.
 * @param {string} label
 * @param {number} x
 * @param {number} y
 * @param {number} w
 * @param {number} size
 * @param {boolean} selected
 * @param {string=} color
 * @return {boolean} True if the row was tapped.
 */
function drawMenuRow(label, x, y, w, size, selected, color) {
  const fill = color || (selected ? OVERLAY_YELLOW : OVERLAY_WHITE);
  setTextAlign(ALIGN_LEFT);
  drawFittedText(label, x, y, w, size, 'italic', fill);
  return takeTapIn(x - 20, y - 12, w + 40, size + 24);
}

/**
 * Draws the current menu and manages menu state.
 */
const drawMenu = () => {
  if (gameState === GameState.CREDITS && menu !== mainMenu && menu !== levelsMenu) {
    menu = null;
    return;
  }

  if (gameState <= GameState.INTRO_STORY2 || menu === mainMenu || menu === levelsMenu) {
    setTextAlign(ALIGN_CENTER);
    setFontSize(24, 'italic');
    drawShadowText(t('titlePre'), CENTER_X, 60);
    drawFittedText(t('titleMain'), CENTER_X, 120, WIDTH - 200, 64, 'italic');
  }

  if (menu === mainMenu) {
    drawMainMenu();
    return;
  }

  if (menu === levelsMenu) {
    drawLevelsMenu();
    return;
  }

  // Story / intro / win / death screens: any input continues.
  //
  // consumeConfirm() replaces upstream's `anyKey.upCount === 1`, which required
  // the key *release* to land on the very next rendered frame and silently
  // dropped the input otherwise. That is what left players stuck on the title
  // screen pressing keys with nothing happening.
  const canContinue = time - menuStartTime > 0.5;
  if (canContinue && consumeConfirm()) {
    menu.callback();
    return;
  }

  clearPendingTap();

  if (gameState === GameState.WAITING_FOR_FIRST_CLICK) {
    setTextAlign(ALIGN_CENTER);
    drawFittedText(touchMode ? t('tapScreen') : t('pressKey'),
        CENTER_X, HEIGHT - 90, WIDTH - 200, 32, 'italic');
  } else if (gameState === GameState.AFTER_LEVEL) {
    setTextAlign(ALIGN_CENTER);
    drawFittedText(t('cleared', level), CENTER_X, 120, WIDTH - 200, 64, 'italic');
    setFontSize(56);
    drawShadowText(starGlyphs(lastRunStars), CENTER_X, 210, OVERLAY_YELLOW);
    setFontSize(40, 'italic');
    drawShadowText(gameTime.toFixed(1) + ' ' + t('sec'), CENTER_X, 290, OVERLAY_LIGHT_GRAY);
    drawFittedText(touchMode ? t('tapScreen') : t('pressKey'),
        CENTER_X, HEIGHT - 90, WIDTH - 200, 32, 'italic');
  } else {
    drawStoryPanel();
  }
};

/**
 * Draws the story / level-title panel at the bottom of intro screens.
 */
function drawStoryPanel() {
  drawRectangle(20, HEIGHT - 200, 1100, 180, '#cb6', OVERLAY_BLACK);

  let lines;
  if (gameState === GameState.BEFORE_LEVEL) {
    lines = [levelName(level), t('tutGoal')];
  } else if (gameState === GameState.INTRO_STORY1) {
    lines = tLines('intro1');
  } else if (gameState === GameState.INTRO_STORY2) {
    lines = tLines('intro2');
  } else {
    lines = tLines('died');
  }

  setTextAlign(ALIGN_LEFT);
  drawFittedText(lines[0], 40, HEIGHT - 185, 1060, 34, 'italic', OVERLAY_BLACK);
  drawFittedText(lines[1] || '', 40, HEIGHT - 135, 1060, 30, 'italic', OVERLAY_BLACK);
  drawFittedText(touchMode ? t('tapScreen') : t('pressKey'),
      40, HEIGHT - 62, 1060, 22, 'italic', OVERLAY_BLACK);
}

/**
 * Draws and drives the main menu.
 */
function drawMainMenu() {
  const rows = [t('newGame'), t('resume'), t('levels')];
  let activated = -1;

  for (let i = 0; i < rows.length; i++) {
    if (drawMenuRow(rows[i], 250, 400 + i * 100, 700, 48, menuY === i)) {
      menuY = i;
      activated = i;
    }
  }

  if (isKeyPressed(KEY_UP) || isKeyPressed(KEY_W)) {
    menuY = (menuY + 2) % 3;
    playMenuBeep();
  }
  if (isKeyPressed(KEY_DOWN) || isKeyPressed(KEY_S)) {
    menuY = (menuY + 1) % 3;
    playMenuBeep();
  }
  if (isKeyPressed(KEY_ESCAPE)) {
    resetKeys();
    setMenu(prevMenu);
    playMenuBeep();
    return;
  }
  if (isKeyPressed(KEY_ENTER) || isKeyPressed(KEY_SPACE) || isKeyPressed(KEY_Z)) {
    activated = menuY;
  }

  clearPendingTap();
  if (activated < 0) {
    return;
  }

  playMenuBeep();
  if (activated === 0) {
    gameState = GameState.INTRO_STORY1;
    setLevel(0);
    initGame();
    setMenu(clickToStart);
  } else if (activated === 1) {
    setMenu(null);
  } else {
    setMenu(levelsMenu);
  }
}

/**
 * Draws and drives the level select.
 *
 * Two columns of six so all twelve levels fit without scrolling, with locks,
 * star ratings and best times so progress is visible at a glance.
 */
function drawLevelsMenu() {
  const perColumn = 6;
  let activated = -1;

  for (let i = 0; i < LEVEL_COUNT; i++) {
    const n = i + 1;
    const col = Math.floor(i / perColumn);
    const row = i % perColumn;
    const x = 180 + col * 820;
    const y = 300 + row * 110;
    const unlocked = isLevelUnlocked(n);

    const label = unlocked ? `${n}. ${levelName(n)}` : `${n}. ${t('locked')}`;
    const color = !unlocked ? OVERLAY_DARK_GRAY : (menuY === i ? OVERLAY_YELLOW : OVERLAY_WHITE);

    if (drawMenuRow(label, x, y, 560, 34, menuY === i, color) && unlocked) {
      menuY = i;
      activated = i;
    }

    const stars = bestStars[n] || 0;
    if (unlocked && stars > 0) {
      setTextAlign(ALIGN_LEFT);
      setFontSize(26);
      drawShadowText(starGlyphs(stars), x, y + 46, OVERLAY_YELLOW);
      if (bestTimes[n]) {
        setTextAlign(ALIGN_RIGHT);
        drawShadowText(bestTimes[n].toFixed(1) + ' ' + t('sec'), x + 560, y + 46, OVERLAY_LIGHT_GRAY);
      }
    }
  }

  if (isKeyPressed(KEY_UP) || isKeyPressed(KEY_W)) {
    menuY = (menuY + LEVEL_COUNT - 1) % LEVEL_COUNT;
    playMenuBeep();
  }
  if (isKeyPressed(KEY_DOWN) || isKeyPressed(KEY_S)) {
    menuY = (menuY + 1) % LEVEL_COUNT;
    playMenuBeep();
  }
  if (isKeyPressed(KEY_LEFT) || isKeyPressed(KEY_A)) {
    menuY = (menuY + LEVEL_COUNT - perColumn) % LEVEL_COUNT;
    playMenuBeep();
  }
  if (isKeyPressed(KEY_RIGHT) || isKeyPressed(KEY_D)) {
    menuY = (menuY + perColumn) % LEVEL_COUNT;
    playMenuBeep();
  }
  if (isKeyPressed(KEY_ESCAPE)) {
    setMenu(prevMenu);
    playMenuBeep();
    return;
  }
  if (isKeyPressed(KEY_ENTER) || isKeyPressed(KEY_SPACE) || isKeyPressed(KEY_Z)) {
    activated = menuY;
  }

  clearPendingTap();
  if (activated < 0 || !isLevelUnlocked(activated + 1)) {
    return;
  }

  playMenuBeep();
  gameState = GameState.BEFORE_LEVEL;
  setLevel(activated + 1);
  showLevelIntro();
}

// ===== mapgen.js =====

// Level geometry.
//
// The builders are almost all upstream's, unchanged - they are playtested
// competition content and there is no reason to redraw them. What changed is the
// *order* (see levels.js for why) plus two new levels that teach jumping and the
// jetpack in isolation, which the original set never did.

// Use a clean RNG based on the current level.
const rng = new RNG(1);

/**
 * Creates a platform.
 * @param {number} x1
 * @param {number} y1
 * @param {number} z1
 * @param {number} x2
 * @param {number} y2
 * @param {number} z2
 * @param {number=} color
 * @return {!Platform}
 */
const createPlatform = (x1, y1, z1, x2, y2, z2, color) => {
  const platform = new Platform();
  vec3.set(platform.pos, (x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
  vec3.set(platform.scale, (x2 - x1) / 2, (y2 - y1) / 2, (z2 - z1) / 2);
  entities.push(platform);
  return platform;
};

/**
 * Creates a metal platform with surface decoration.
 * @param {number} x1
 * @param {number} y1
 * @param {number} z1
 * @param {number} x2
 * @param {number} y2
 * @param {number} z2
 * @param {boolean=} goombas
 */
const createMetalPlatform = (x1, y1, z1, x2, y2, z2, goombas) => {
  createPlatform(x1, y1, z1, x2, y2, z2, COLOR_SILVER);

  for (let x = x1 + 2; x < x2; x += 4) {
    for (let z = z1 + 2; z < z2; z += 4) {
      const m = buffers[STATIC_CUBES].addInstance(COLOR_DARK_BLUE);
      mat4.translate(m, m, vec3.fromValues(x, y2 + 0.01, z));
      mat4.scale(m, m, vec3.fromValues(1.8, 0.02, 1.8));
    }
  }

  const dx = x2 - x1;
  const dz = z2 - z1;

  // Add goombas
  if (goombas) {
    for (let i = 0; i < dx * dz * 0.01; i++) {
      const x = x1 + 0.5 + rng.nextFloat() * (dx - 1.0);
      const z = z1 + 0.5 + rng.nextFloat() * (dz - 1.0);
      const alien = new Alien();
      vec3.set(alien.pos, x, y2, z);
      entities.push(alien);
    }
  }
};

/**
 * Creates a lift (a moving platform).
 * @param {number} x1
 * @param {number} y1
 * @param {number} z1
 * @param {number} x2
 * @param {number} y2
 * @param {number} z2
 * @return {!Platform}
 */
const createLift = (x1, y1, z1, x2, y2, z2) => {
  const platform = new Platform();
  vec3.set(platform.pos, x1, y1, z1);
  vec3.set(platform.scale, 2, 0.3, 2);
  platform.waypoints = [
    vec3.fromValues(x1, y1, z1),
    vec3.fromValues(x2, y2, z2),
  ];
  entities.push(platform);
  return platform;
};

/**
 * Creates a row of coins.
 * @param {number} x1
 * @param {number} y1
 * @param {number} z1
 * @param {number} dx
 * @param {number} dz
 * @param {number} count
 */
const createCoins = (x1, y1, z1, dx, dz, count) => {
  let x = x1;
  let z = z1;
  for (let i = 0; i < count; i++) {
    const coin = new Coin();
    vec3.set(coin.pos, x, y1, z);
    entities.push(coin);
    x += dx;
    z += dz;
  }
};

/**
 * Creates a stairway.
 * @param {number} x
 * @param {number} y
 * @param {number} z
 * @param {number} dx
 * @param {number} dz
 * @param {number} count
 */
const createStairs = (x, y, z, dx, dz, count) => {
  for (let i = 0; i < count; i++) {
    createPlatform(x, y, z, x + 4, y + 1, z + 4, COLOR_SILVER);
    x += dx;
    y++;
    z += dz;
  }
};

/**
 * Walls a rectangular arena so the player physically cannot fall out.
 *
 * Used only by the two teaching levels. Everywhere else falling is a legitimate
 * failure, but a player still working out which button jumps should not be able
 * to die before the game has told them the rules.
 *
 * `wallTop` is an absolute height and must be kept low. The camera sits 52 m up
 * and 52 m back, so a wall on the south edge is between the camera and the
 * player: at the start of a level the sight line clears roughly y=12, and a
 * taller wall hides the player behind it. A wall only has to out-top the
 * player's feet to block them - the side-push collision does the rest - so a
 * couple of metres of lip is both sufficient and safe.
 * @param {number} x1
 * @param {number} z1
 * @param {number} x2
 * @param {number} z2
 * @param {number} floorBottom Height the wall geometry starts from.
 * @param {number} wallTop Absolute height of the wall top.
 */
const encloseArena = (x1, z1, x2, z2, floorBottom, wallTop) => {
  createMetalPlatform(x1 - 2, floorBottom, z1 - 2, x1, wallTop, z2 + 2); // West
  createMetalPlatform(x2, floorBottom, z1 - 2, x2 + 2, wallTop, z2 + 2); // East
  createMetalPlatform(x1 - 2, floorBottom, z1 - 2, x2 + 2, wallTop, z1); // South
  createMetalPlatform(x1 - 2, floorBottom, z2, x2 + 2, wallTop, z2 + 2); // North
};

/**
 * Level geometry builders, keyed by the `build` field in LEVELS.
 * @const {!Object.<string, !Function>}
 */
const LEVEL_BUILDERS = {
  /**
   * Teaches walking, jumping, collecting and the exit.
   *
   * New level. A fully enclosed two-tier box: the step between tiers is 1.6 m,
   * which cannot be walked up but clears on even a tapped jump (a jump reaches
   * 1.8 m at minimum, 3.6 m if the button is held), and the arena walls make
   * death impossible. That gives the tutorial prompts somewhere safe to run.
   */
  firstSteps: () => {
    createMetalPlatform(-4, 0, -4, 36, 4, 16); // Lower tier, top y=4
    createMetalPlatform(-4, 0, 16, 36, 5.6, 30); // Upper tier, top y=5.6
    // Wall top 7.6: two metres above the upper tier, well under the ~12 m the
    // camera sight line clears at the start position.
    encloseArena(-4, -4, 36, 30, 0, 7.6);

    createCoins(8, 5, 6, 6, 0, 4); // Walk over these
    createCoins(10, 6.6, 22, 6, 0, 3); // Reachable only after the step up

    vec3.set(player.pos, 16, 4, 2);
    entities.push(new Flagpole(16, 5.6, 27));
  },

  /**
   * Upstream "Level 1 - Intro level". Introduces lifts.
   */
  firstContact: () => {
    // z = 0-12
    createMetalPlatform(4, 0, 0, 32, 4, 4); // 1st platform
    createCoins(14, 5, 2, 4, 0, 3);
    createMetalPlatform(28, 0, 4, 32, 4, 8); // Short connector
    createLift(30, 3, 10, 30, 8, 10);

    // z = 12-24
    createMetalPlatform(0, 4, 12, 32, 8, 16); // 2nd platform
    createCoins(14, 9, 14, 4, 0, 3);
    createMetalPlatform(0, 4, 16, 4, 8, 20); // Short connector
    createLift(2, 12, 22, 2, 7, 22);

    // z = 24-36
    createMetalPlatform(0, 8, 24, 16, 12, 28); // 3rd platform
    createMetalPlatform(16, 8, 24, 32, 10, 28); // 3rd platform
    const alien = new Alien();
    alien.aggroRange = 0;
    vec3.set(alien.pos, 18, 10, 26);
    alien.waypoints = [
      vec3.fromValues(17, 10, 26),
      vec3.fromValues(27, 10, 26),
    ];
    entities.push(alien);
    entities.push(new Flagpole(30, 10, 26));
    vec3.set(player.pos, 6, 4, 2);
  },

  /**
   * Upstream "Level 2 - Maze level". One contiguous stepped corridor with two
   * fixed-route aliens and no lifts, which makes it the gentlest place to meet an
   * enemy - hence its promotion to second.
   */
  highRoad: () => {
    createMetalPlatform(12, 3.5, 0, 20, 4.5, 8); // Starting platform, z=0..8
    createMetalPlatform(0, 4, 8, 32, 5, 12); // First long platform, z=8..12
    createMetalPlatform(8, 4.5, 12, 12, 5.5, 16); // First connector, z=12..16
    createMetalPlatform(0, 5, 16, 32, 6, 20); // Second long platform, z=16..20
    createMetalPlatform(20, 5.5, 20, 24, 6.5, 24); // Second connector, z=20..24
    createMetalPlatform(0, 6, 24, 32, 7, 28); // Third platform, z=24..28

    createCoins(2, 6, 10, 28, 0, 2);
    createCoins(2, 7, 18, 28, 0, 2);
    createCoins(10, 8, 26, 4, 0, 4);

    const alien1 = new Alien(4, 5, 10);
    alien1.aggroRange = 0;
    alien1.waypoints = [vec3.fromValues(4, 5, 10), vec3.fromValues(28, 5, 10)];
    entities.push(alien1);

    const alien2 = new Alien(4, 6, 18);
    alien2.aggroRange = 0;
    alien2.waypoints = [vec3.fromValues(4, 6, 18), vec3.fromValues(28, 6, 18)];
    entities.push(alien2);

    vec3.set(player.pos, 16, 4, 2);
    entities.push(new Flagpole(2, 7, 26));
  },

  /**
   * Upstream "Level 7 - Firing Squad". Moved much earlier: it is the
   * cleanest possible projectile lesson because the arena is one flat slab with
   * nothing to fall off, so a missile hit is the only way to fail.
   */
  firingSquad: () => {
    createMetalPlatform(0, 0, 0, 32, 4, 32);

    for (let z = 4; z <= 28; z += 8) {
      for (let x = 4; x <= 28; x += 8) {
        entities.push(new Coin(x, 5, z));
      }
    }

    vec3.set(player.pos, 16, 5, 2);

    let nextShootTime = 0.0;

    for (let x = 4; x <= 28; x += 8) {
      entities.push(new Shooter(x, 5, 34, Math.PI, (nextShootTime += 0.5)));
    }

    for (let z = 4; z <= 28; z += 8) {
      let x = -2;
      let yaw = Math.PI / 2;
      if (((z - 4) / 8) % 2 !== 0) {
        x = 34;
        yaw = -yaw;
      }
      entities.push(new Shooter(x, 5, z, yaw, (nextShootTime += 0.5)));
    }

    entities.push(new Flagpole(16, 4, 16));
  },

  /**
   * Teaches the jetpack.
   *
   * New level, and the one the original set most needed: upstream required
   * jetpack flight to finish "Four Corners" without ever introducing it, and
   * punished a failed attempt with a fatal fall. Here the climb is three
   * identical 5 m hops across 4 m gaps, every tier carries fuel, and a walled
   * catch floor with a lift back up means a botched flight costs seconds rather
   * than the run.
   */
  jetpackTraining: () => {
    // Catch floor: generous, walled, and low enough to read as "below".
    createMetalPlatform(-4, -8, -4, 40, -4, 42);
    // Only a lip around the catch floor is needed here - the catch floor itself
    // already stops falls off the tiers, so the wall never has to be tall, and a
    // tall one would hide the player from the camera at the start.
    encloseArena(-4, -4, 40, 42, -8, -1);

    // Staircase from the catch floor back up to the start, so a player who runs
    // dry down there recovers by walking rather than by restarting. Deliberately
    // stairs and not a lift: lifts are introduced by the *next* level, and the
    // difficulty checker enforces that a mechanic never appears before the level
    // that teaches it.
    for (let i = 0; i < 8; i++) {
      createMetalPlatform(-2, -8, 2 + i * 2, 2, -3 + i, 4 + i * 2);
    }

    createMetalPlatform(4, 0, 0, 28, 4, 10); // Start, top y=4
    entities.push(new Fuel(16, 5, 5, 80));
    createCoins(10, 5, 5, 6, 0, 3);

    createMetalPlatform(4, 0, 14, 16, 9, 24); // Tier 1, top y=9

/**
 * Builds the opening cinematic scene (level 0).
 */
const buildOpeningScene = () => {
  entities.push(new Spaceship());
};

/**
 * Initialize the game.
 */
function initGame() {
  // Clear any existing static geometry
  buffers.forEach((b) => b.usage === STATIC_DRAW && b.resetBuffers());

  // Clear any existing entities
  entities.length = 0;

  // Reset the player
  vec3.set(player.pos, 16, 4, 16);
  vec3.set(player.velocity, 0, 0, 0);
  player.rendered = true;
  player.jetpack = false;
  player.health = 1;
  player.fuel = 0;
  player.yaw = 3.0;
  player.groundedTime = 0;
  player.shootTime = 0;
  coins = 0;
  lastCoinTime = 0;
  coinSequence = 0;
  entities.push(player);
  stopJetpackSound();
  releaseTouchControls();

  // Sky box
  {
    const m = buffers[STATIC_CUBES].addInstance(COLOR_STARS);
    mat4.scale(m, m, vec3.fromValues(500, 500, 500));
  }

  // Level geometry
  if (level <= 0) {
    buildOpeningScene();
  } else if (level > LEVEL_COUNT) {
    gameState = GameState.CREDITS;
  } else {
    LEVEL_BUILDERS[levelInfo(level).build]();
  }

  availableCoins = entities.filter((e) => e instanceof Coin).length;
  buffers.forEach((b) => b.usage === STATIC_DRAW && b.updateBuffers());

  resetTutorial(level);
}

// ===== index.js =====

/** @const {!vec3} */
const cameraTarget = vec3.fromValues(0, 0, 0);

/** @const {!vec3} */
const preferredCameraPosition = vec3.fromValues(0, 0, 0);

/** @const {!vec3} */
const lightPosition = vec3.fromValues(200, 400, -32);

// 4 geometry types:
const cubeGeometry = buildRoundedCube(1, 2);
const sphereGeometry = buildRoundedCube(21, 1);
buffers.push(
    new BufferSet(STATIC_DRAW, cubeGeometry, 200000),
    new BufferSet(STATIC_DRAW, sphereGeometry, 1000),
    new BufferSet(DYNAMIC_DRAW, cubeGeometry, 4000),
    new BufferSet(DYNAMIC_DRAW, sphereGeometry, 2000),
);

const entities = /** @const {!Array.<!GameEntity>} */ ([]);
const player = new Hero();

/**
 * Current camera distance.
 * @type {number}
 */
const cameraDistance = 52;

/**
 * Number of coins collected by the player.
 * @type {number}
 */
let coins = 0;

/**
 * Number of coins available in the level.
 */
let availableCoins = 0;

/**
 * Timestamp of the last coin.
 * This is used to reset the coin sound effect sequence.
 * @type {number}
 */
let lastCoinTime = 0;

/**
 * How many coins in the sequence.
 * Resets if no coins for one second.
 * @type {number}
 */
let coinSequence = 0;

/**
 * Never called.
 * Keeps eslint happy.
 */
function throwaway() {
  gameState = GameState.PLAYING;
  coins++;
  availableCoins++;
  lastCoinTime++;
  coinSequence++;
}

/**
 * Current level.
 * @type {number}
 */
let level = 0;

/**
 * Time of last engine burst.
 * This is used in opening cinematic to control engine animations.
 * @type {number}
 */
let lastEngineBurst = 0;

/**
 * Game state enum.
 * @enum {number}
 */
const GameState = {
  WAITING_FOR_FIRST_CLICK: 0,
  INTRO_STORY1: 1,
  INTRO_STORY2: 2,
  BEFORE_LEVEL: 3,
  PLAYING: 4,
  AFTER_LEVEL: 5,
  MAIN_MENU: 99,
  CREDITS: 100,
};

/**
 * Global game state.
 * @type {!GameState}
 */
let gameState = GameState.WAITING_FOR_FIRST_CLICK;

initGame();
registerSong('Milky Way by Ben Prunty', milkyWaySong);

/**
 * Sets the current level.
 * @param {number} l
 */
function setLevel(l) {
  level = l;
}

/**
 * Camera flies over the city.
 */
const flyoverCamera = () => {
  const theta = 0.2 * time;
  const rho = 0.05 * time;
  const radius = 50 + 20 * Math.sin(0.2 * time);
  const x = radius * Math.sin(rho) * Math.sin(theta);
  const y = radius * Math.abs(Math.cos(rho));
  const z = radius * Math.sin(rho) * Math.cos(theta);
  vec3.set(camera.source, x, y, z);
};

/**
 * Updates game state.
 */
function update() {
  updateWorld();

  if (menu !== mainMenu && isKeyPressed(KEY_ESCAPE)) {
    requestPauseMenu();
  }

  if (menu) {
    drawMenu();
  } else {
    handleInput();
    if (gameState === GameState.PLAYING) {
      updateTutorial();
    }
    drawHud();
  }

  if (DEBUG) {
    drawDebugOverlay();
  }

  if (gameState === GameState.CREDITS) {
    player.yaw = 0;
    player.jetpack = true;
    vec3.lerp(camera.source, camera.source, vec3.fromValues(0, 50, -15), 0.01);
    vec3.lerp(player.pos, player.pos, vec3.fromValues(0, 80, 0), 0.01);
    vec3.set(player.velocity, 0, 0, 0);
    lookAt(camera, camera.source, vec3.fromValues(player.pos[0], player.pos[1] + 15, player.pos[2]), 0.4);
    createJetpackParticles();
  } else if (gameState === GameState.AFTER_LEVEL) {
    // After level success
    player.yaw += 5 * dt;
    player.jetpack = true;
    vec3.lerp(camera.source, camera.source, vec3.fromValues(0, 90, -25), 0.01);
    vec3.lerp(player.pos, player.pos, vec3.fromValues(0, 80, 0), 0.01);
    vec3.set(player.velocity, 0, 0, 0);
    cameraTarget[0] = player.pos[0];
    cameraTarget[1] = player.pos[1] + 2;
    cameraTarget[2] = player.pos[2];
    lookAt(camera, camera.source, cameraTarget, 0.4);
    createJetpackParticles();
  } else if (gameState === GameState.BEFORE_LEVEL || gameState === GameState.PLAYING) {
    // Normal gameplay mode
    lightSource[0] = player.pos[0] + 8;
    lightSource[1] = 80;
    lightSource[2] = player.pos[2] - 16;

    cameraTarget[0] = 0.5 * 16 + 0.5 * player.pos[0];
    // cameraTarget[0] = player.pos[0];
    cameraTarget[1] = 0.9 * cameraTarget[1] + 0.1 * player.pos[1];
    cameraTarget[2] = 0.25 * 16 + 0.75 * player.pos[2];

    vec3.set(
        preferredCameraPosition,
        0.2 * 16 + 0.8 * cameraTarget[0],
        cameraTarget[1] + cameraDistance,
        (0.25 * 8 + 0.75 * cameraTarget[2]) - cameraDistance);

    camera.source[0] = preferredCameraPosition[0]; // X-position is locked
    vec3.lerp(camera.source, camera.source, preferredCameraPosition, 0.02);
    lookAt(camera, camera.source, cameraTarget, 0.4);
  } else if (gameState <= GameState.INTRO_STORY2) {
    // Camera circles the game world
    // and looks at the center
    // vec3.set(camera.source, 0, 40, -40);
    flyoverCamera();
    vec3.set(cameraTarget, 0, 0, 0);
    lookAt(camera, camera.source, cameraTarget, 0.4);

    // Force player off screen
    player.pos[1] = 400;
    player.velocity[1] = 0;

    if (time - lastEngineBurst > 0.08) {
      lastEngineBurst = time;

      const leftBurst = new Particle();
      const rightBurst = new Particle();
      leftBurst.size = rightBurst.size = 0.25;
      leftBurst.color = rightBurst.color = 0xFFFF0030;
      vec3.set(leftBurst.pos, -6, 0.3, 0.7);
      vec3.set(leftBurst.velocity, -10, 0, 0);
      vec3.set(rightBurst.pos, -6, 0.3, -0.7);
      vec3.set(rightBurst.velocity, -10, 0, 0);
      entities.push(leftBurst, rightBurst);
    }
  }

  // lookAt(lightSource, lightPosition, cameraTarget, 0.1);
  lookAt(lightSource, lightPosition, vec3.fromValues(16, 0, 16), 0.1);
  renderEntities(entities);
}

/**
 * Returns true if the entity is within "range" of the player.
 * This is a fast check if the entity is within ~20 meters of the player.
 * Note that it uses manhattan distance rather than true distance for performance.
 * @param {!GameEntity} entity
 * @return {boolean}
 */
function inRangeOfPlayer(entity) {
  return entity.pos[0] > player.pos[0] - 20 &&
    entity.pos[0] < player.pos[0] + 20 &&
    entity.pos[2] > player.pos[2] - 15 &&
    entity.pos[2] < player.pos[2] + 40;
}

/**
 * Renders an array of game entities to the dynamic buffer.
 * @param {!Array.<!GameEntity>} entities
 */
function renderEntities(entities) {
  resetLights();
  for (let i = entities.length - 1; i >= 0; i--) {
    const entity = entities[i];
    if (entity !== player && entity.health <= 0) {
      entities.splice(i, 1);
      continue;
    }
    if (entity.rendered) {
      entity.setupTransformMatrix();
      entity.render();
    }
  }
}

/**
 * Player died.
 */
function playerDie() {
  playMusic(deathSongData);
  stopJetpackSound();
  if (level > 0) {
    levelDeaths++;
  }
  setMenu(deathScreen);
}

/**
 * Handles player input.
 */
function handleInput() {
  player.accelerating = false;

  if (gameState !== GameState.AFTER_LEVEL && gameState !== GameState.CREDITS) {
    // Digital keyboard axes, then the analog thumbstick on top. The stick is
    // proportional, so a light push walks and a full push runs - important on a
    // phone, where a four-way pad makes the narrower platforms miserable.
    let ax = 0;
    let az = 0;
    if (isKeyDown(KEY_UP) || isKeyDown(KEY_W)) {
      az += 1;
    }
    if (isKeyDown(KEY_DOWN) || isKeyDown(KEY_S)) {
      az -= 1;
    }
    if (isKeyDown(KEY_LEFT) || isKeyDown(KEY_A)) {
      ax -= 1;
    }
    if (isKeyDown(KEY_RIGHT) || isKeyDown(KEY_D)) {
      ax += 1;
    }
    ax += touchMoveX;
    az += touchMoveZ;

    const magnitude = Math.hypot(ax, az);
    if (magnitude > 0) {
      // Clamp so diagonals are not faster than the cardinals.
      const scale = Math.min(1, magnitude) / magnitude;
      player.velocity[0] += dt * ACCELERATION * ax * scale;
      player.velocity[2] += dt * ACCELERATION * az * scale;
      player.accelerating = true;
    }

    if ((isKeyDown(KEY_X) || isKeyDown(KEY_SHIFT)) && player.fuel > 0) {
      // Jetpack
      player.velocity[1] += dt * 60;
      player.jetpack = true;
      player.fuel = Math.max(0, player.fuel - dt * 20);
      createJetpackParticles();
    } else {
      player.jetpack = false;
    }
    if (player.jetpack && !jetpackSound) {
      startJetpackSound();
    }
    if (!player.jetpack && jetpackSound) {
      stopJetpackSound();
    }

    // consumeJump() replaces a `downCount === 1` test, which only fired if the
    // press happened to be observed on exactly one frame. It also buffers: a
    // jump pressed just before landing now still fires, instead of being eaten.
    if (player.isGrounded() && consumeJump()) {
      player.jump();
      noteTutorialJump();
    }

    if (isKeyPressed(KEY_R)) {
      playerDie();
    }
    if (isKeyPressed(KEY_M)) {
      toggleBackgroundMusic();
    }
    // Escape hatch: after repeated deaths on one level, let the player move on
    // rather than abandon the game entirely.
    if (isKeyPressed(KEY_N) && canSkipLevel()) {
      grantSkip(level);
      playMenuBeep();
      gameState = GameState.BEFORE_LEVEL;
      setLevel(level + 1);
      showLevelIntro();
    }
  }
}

/**
 * Creates jetpack particles.
 */
function createJetpackParticles() {
  if (Math.random() < 0.3) {
    const blast = new Particle();
    blast.size = 0.2;
    blast.velocity[1] = (gameState === GameState.AFTER_LEVEL || gameState === GameState.CREDITS) ? -10 : -0.3;
    vec3.copy(blast.pos, player.pos);
    blast.pos[0] -= 0.3 * Math.sin(player.yaw);
    blast.pos[1] += 0.8;
    blast.pos[2] -= 0.3 * Math.cos(player.yaw);
    entities.push(blast);
  }
}

/**
 * Updates everything.
 */
function updateWorld() {
  if (Math.random() < 0.02) {
    const floaty = new Particle();
    floaty.size = 0.08;
    floaty.velocity[1] = 1;
    vec3.copy(floaty.pos, player.pos);
    floaty.pos[0] += (Math.random() - 0.5) * 30.0;
    floaty.pos[2] += (Math.random() - 0.5) * 30.0;
    entities.push(floaty);
  }

  if (gameTime - lastCoinTime > 1.0) {
    coinSequence = 0;
  }

  for (let i = 0; i < entities.length; i++) {
    entities[i].update();
  }

  const playerWasAlive = player.health > 0;

  for (let i = 0; i < entities.length; i++) {
    for (let j = 0; j < entities.length; j++) {
      if ((entities[i] instanceof Platform) && !(entities[j] instanceof Platform)) {
        const platform = /** @type {!Platform} */ (entities[i]);
        const actor = entities[j];
        // Need actor size
        // Assume actor is a cylinder
        // Assume radius 1.0 and height 3.0
        // actor.pos represents center of feet
        const actorX = actor.pos[0];
        const actorY = actor.pos[1];
        const actorZ = actor.pos[2];
        const projectile = actor instanceof Particle && actor.projectile > 0;
        const actorRadius = projectile ? 0.1 : 0.7;
        const actorHeight = projectile ? 0.1 : 2.5;

        const platformMinX = platform.pos[0] - platform.scale[0] - actorRadius;
        const platformMinY = platform.pos[1] - platform.scale[1];
        const platformMinZ = platform.pos[2] - platform.scale[2] - actorRadius;

        const platformMaxX = platform.pos[0] + platform.scale[0] + actorRadius;
        const platformMaxY = platform.pos[1] + platform.scale[1];
        const platformMaxZ = platform.pos[2] + platform.scale[2] + actorRadius;

        const graceY = 1.0;

        if (actorX > platformMinX && actorX < platformMaxX && actorZ > platformMinZ && actorZ < platformMaxZ) {
          if (projectile && actorY < platformMaxY && actorY > platformMinY) {
            // Destroy the projectile
            actor.health = 0;
          } else if (actorY > platformMaxY - graceY && actorY < platformMaxY) {
            // Put the actor on top of the platform
            actor.pos[1] = platformMaxY;
            if (actor.velocity[1] < 0) {
              actor.velocity[1] = 0;
              actor.groundedTime = gameTime;
              actor.groundedPlatform = platform;
            }
          } else if (actorY < platformMaxY && actorY + actorHeight > platformMinY) {
            // Determine which edge to use
            // Push the actor away from the platform
            if (actorX < platform.pos[0] - platform.scale[0]) {
              actor.pos[0] = platformMinX;
            } else if (actorX > platform.pos[0] + platform.scale[0]) {
              actor.pos[0] = platformMaxX;
            } else if (actorZ < platform.pos[2] - platform.scale[2]) {
              actor.pos[2] = platformMinZ;
            } else {
              actor.pos[2] = platformMaxZ;
            }
          }
        }
      }

      vec3.copy(tempVec, player.pos);
      tempVec[1] += 1;
      if (entities[i] instanceof Hero &&
        entities[j] instanceof Particle &&
        (/** @type {!Particle} */ (entities[j])).projectile === ProjectileType.Enemy &&
        vec3.distance(tempVec, entities[j].pos) < 1.5 &&
        gameState === GameState.PLAYING) {
        player.health = 0;
        player.rendered = false;
        entities[j].health = 0;

        playExplosionSound();
        createExplosion(player.pos, COLOR_WHITE);
      }
    }
  }

  updateEntity(player);

  if (playerWasAlive && player.health <= 0) {
    playerDie();
  }
}

/**
 * Creates an explosion.
 * @param {!vec3} startPos
 * @param {number=} color
 * @param {number=} count
 */
function createExplosion(startPos, color = COLOR_WHITE, count = 40) {
  log('Create explosion');
  for (let k = 0; k < count; k++) {
    const explosion = new Particle();
    vec3.copy(explosion.pos, startPos);
    explosion.pos[1] += 1.0;
    explosion.color = color;
    explosion.size = 0.4;
    const speed = 0.2 + Math.random() * 5.0;
    const direction = Math.random() * 6.28;
    explosion.velocity[0] = Math.sin(direction) * speed;
    explosion.velocity[1] = 2;
    explosion.velocity[2] = Math.cos(direction) * speed;
    explosion.acceleration[1] = -0.5;
    entities.push(explosion);
  }
}

/**
 * Updates a game entity for the frame.
 * @param {!GameEntity} entity
 */
function updateEntity(entity) {
  if (entity.isGrounded() && entity.groundedPlatform) {
    // Move the player with the platform
    vec3.scaleAndAdd(entity.pos, entity.pos, entity.groundedPlatform.velocity, dt);
  }

  entity.velocity[0] *= (1.0 - dt * FRICTION);
  entity.velocity[2] *= (1.0 - dt * FRICTION);

  entity.pos[0] += dt * entity.velocity[0];
  entity.pos[2] += dt * entity.velocity[2];

  const speed = vec3.magnitude(entity.velocity);
  if (vec3.magnitude(entity.velocity) > 0.1) {
    entity.yaw = Math.atan2(entity.velocity[0], entity.velocity[2]);
  } else {
    vec3.set(entity.velocity, 0, 0, 0);
  }

  if (gameState === GameState.CREDITS) {
    player.yaw = 0;
    if (Math.random() < 0.5) {
      const box = new Mystery(
          (Math.random() < 0.5 ? -1 : 1) * (10 + 40 * Math.random()), 600, (Math.random() < 0.5 ? -1 : 1) * (10 + 40 * Math.random()),
          2 + 2 * Math.random(), 4 + 20 * Math.random(), 2 + 2 * Math.random());
      box.velocity[1] = -100 - 400 * Math.random();
      entities.push(box);
    }
  } else if (gameState !== GameState.AFTER_LEVEL) {
    const gravity = GRAVITY;
    entity.velocity[1] -= dt * gravity;
    entity.pos[1] += dt * entity.velocity[1];
  }

  if (entity.isGrounded() && speed > 5 && Math.random() < 0.2) {
    const dust = new Particle();
    dust.velocity[1] = 0.1;
    vec3.copy(dust.pos, entity.pos);
    entities.push(dust);
  }

  if (entity.pos[1] < -30) {
    entity.pos[1] = -30;
    entity.health = 0;
  }
}

// Progress (best times, stars, unlocks) now lives in levels.js, which reads it
// through storage helpers that tolerate localStorage being unavailable - a bare
// `localStorage[...]` here threw and killed the whole game in sandboxed frames.

})();
</script>
