<script>
(function(){
// ===== lib/debug.js =====

/**
 * Controls logging level.
 * When false, all logging becomes no-op, so compiled to nothing.
 * @const {boolean}
 */
const DEBUG = false;

/**
 * Logs to std out.
 * Only if debug is enabled.
 * @param {string} str
 */
function log(str) {
  if (DEBUG) {
    console.log(str);
  }
}

// ===== lib/codegolf.js =====

// This file is for silly code optimizations.
// See: https://xem.github.io/articles/webgl_quest.html
// See: https://github.com/carlini/js13k2019-yet-another-doom-clone/blob/master/make.py

/**
 * Builds a shortcut name for a property.
 * @param {string} name The original name.
 * @return {string} The abbreviated name.
 */
const buildShortcut = (name) => name.substr(0, 3) + name.substr(-3) + (name[name.length - 8] || '_');

/**
 * Builds shortcut properties for all existing properties on an object.
 * @param {!Object} obj
 */
const buildShortcuts = (obj) => {
  for (const key in obj) {
    const s = buildShortcut(key);
    if (!(s in obj)) {
      log(`Shortcut '${s}' for '${key}'`);
      obj[s] = obj[key];
    }
  }
};

// ===== lib/os13k.js =====

const icon = '👨‍🚀';

const gameName = 'Captain Callisto';

/**
 * Adds an OS13k trophy.

 */
const addTrophy = (trophyName, message = '') => {
  writeStore(`OS13kTrophy,${icon},${gameName},${trophyName}`, message);

/**

// ===== lib/rng.js =====

/**
 * Random number generator.
 *
 * LCG
 * https://stackoverflow.com/a/424445/2051724
 */
class RNG {
  /**
     * Creates a new random number generator.
     * @param {number} seed  The integer seed.
     */
  constructor(seed) {
    // LCG using GCC's constants
    this.m = 0x80000000; // 2**31;
    this.a = 1103515245;
    this.c = 12345;
    this.state = seed;
  }

  /**
     * @return {number}
     */
  nextInt() {
    this.state = (this.a * this.state + this.c) % this.m;
    return this.state;
  }

  /**
     * @return {number}
     */
  nextFloat() {
    // returns in range [0,1]
    return this.nextInt() / (this.m - 1);
  }

  /**
     * @param {number} start
     * @param {number} end
     * @return {number}
     */
  nextRange(start, end) {
    // returns in range [start, end): including start, excluding end
    // can't modulu nextInt because of weak randomness in lower bits
    const rangeSize = end - start;
    const randomUnder1 = this.nextInt() / this.m;
    return start + ((randomUnder1 * rangeSize) | 0);
  }
}

// ===== lib/vec3.js =====
// glMatrix - vec3
// https://github.com/toji/gl-matrix/blob/master/src/gl-matrix/vec3.js

/** @typedef {!Float32Array} */
const vec3 = {};

/**
 * Creates a new, empty vec3
 *
 * @return {!vec3} a new 3D vector
 */
vec3.create = () => new Float32Array(3);

/**
 * Creates a new vec3 initialized with values from an existing vector
 *
 * @param {!vec3} a vector to clone
 * @return {!vec3} a new 3D vector
 */
vec3.clone = (a) => new Float32Array(a);

/**
 * Calculates the magnitude of a vec3
 *
 * @param {!vec3} a vector to calculate length of
 * @return {number} length of a
 */
vec3.magnitude = (a) => Math.hypot(a[0], a[1], a[2]);

/**
 * Creates a new vec3 initialized with the given values
 *
 * @param {number} x X component
 * @param {number} y Y component
 * @param {number} z Z component
 * @return {!vec3} a new 3D vector
 * @noinline
 */
vec3.fromValues = (x, y, z) => new Float32Array([x, y, z]);

/**
 * Copy the values from one vec3 to another
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a the source vector
 * @return {!vec3} out
 */
vec3.copy = (out, a) => {
  out[0] = a[0];
  out[1] = a[1];
  out[2] = a[2];
  return out;
};

/**
 * Set the components of a vec3 to the given values
 *
 * @param {!vec3} out the receiving vector
 * @param {number} x X component
 * @param {number} y Y component
 * @param {number} z Z component
 * @return {!vec3} out
 */
vec3.set = (out, x, y, z) => {
  out[0] = x;
  out[1] = y;
  out[2] = z;
  return out;
};

/**
 * Adds two vec3's
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a the first operand
 * @param {!vec3} b the second operand
 * @return {!vec3} out
 */
vec3.add = (out, a, b) => {
  out[0] = a[0] + b[0];
  out[1] = a[1] + b[1];
  out[2] = a[2] + b[2];
  return out;
};

/**
 * Subtracts vector b from vector a
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a the first operand
 * @param {!vec3} b the second operand
 * @return {!vec3} out
 */
vec3.subtract = (out, a, b) => {
  out[0] = a[0] - b[0];
  out[1] = a[1] - b[1];
  out[2] = a[2] - b[2];
  return out;
};

/**
 * Multiplies two vec3's
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a the first operand
 * @param {!vec3} b the second operand
 * @return {!vec3} out
 */
vec3.multiply = (out, a, b) => {
  out[0] = a[0] * b[0];
  out[1] = a[1] * b[1];
  out[2] = a[2] * b[2];
  return out;
};

/**
 * Divides two vec3's
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a the first operand
 * @param {!vec3} b the second operand
 * @return {!vec3} out
 */
vec3.divide = (out, a, b) => {
  out[0] = a[0] / b[0];
  out[1] = a[1] / b[1];
  out[2] = a[2] / b[2];
  return out;
};

/**
 * Math.ceil the components of a vec3
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a vector to ceil
 * @return {!vec3} out
 */
vec3.ceil = (out, a) => {
  out[0] = Math.ceil(a[0]);
  out[1] = Math.ceil(a[1]);
  out[2] = Math.ceil(a[2]);
  return out;
};

/**
 * Returns the minimum of two vec3's
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a the first operand
 * @param {!vec3} b the second operand
 * @return {!vec3} out
 */
vec3.min = (out, a, b) => {
  out[0] = Math.min(a[0], b[0]);
  out[1] = Math.min(a[1], b[1]);
  out[2] = Math.min(a[2], b[2]);
  return out;
};

/**
 * Returns the maximum of two vec3's
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a the first operand
 * @param {!vec3} b the second operand
 * @return {!vec3} out
 */
vec3.max = (out, a, b) => {
  out[0] = Math.max(a[0], b[0]);
  out[1] = Math.max(a[1], b[1]);
  out[2] = Math.max(a[2], b[2]);
  return out;
};

/**
 * Scales a vec3 by a scalar number
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a the vector to scale
 * @param {number} b amount to scale the vector by
 * @return {!vec3} out
 */
vec3.scale = (out, a, b) => {
  out[0] = a[0] * b;
  out[1] = a[1] * b;
  out[2] = a[2] * b;
  return out;
};

/**
 * Adds two vec3's after scaling the second operand by a scalar value
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a the first operand
 * @param {!vec3} b the second operand
 * @param {number} scale the amount to scale b by before adding
 * @return {!vec3} out
 */
vec3.scaleAndAdd = (out, a, b, scale) => {
  out[0] = a[0] + (b[0] * scale);
  out[1] = a[1] + (b[1] * scale);
  out[2] = a[2] + (b[2] * scale);
  return out;
};

/**
 * Calculates the euclidian distance between two vec3's
 *
 * @param {!vec3} a the first operand
 * @param {!vec3} b the second operand
 * @return {number} distance between a and b
 */
vec3.distance = (a, b) => {
  const x = b[0] - a[0];
  const y = b[1] - a[1];
  const z = b[2] - a[2];
  return Math.hypot(x, y, z);
};

/**
 * Calculates the squared euclidian distance between two vec3's
 *
 * @param {!vec3} a the first operand
 * @param {!vec3} b the second operand
 * @return {number} squared distance between a and b
 */
vec3.squaredDistance = (a, b) => {
  const x = b[0] - a[0];
  const y = b[1] - a[1];
  const z = b[2] - a[2];
  return x * x + y * y + z * z;
};

/**
 * Calculates the squared length of a vec3
 *
 * @param {!vec3} a vector to calculate squared length of
 * @return {number} squared length of a
 */
vec3.squaredLength = (a) => {
  const x = a[0];
  const y = a[1];
  const z = a[2];
  return x * x + y * y + z * z;
};

/**
 * Negates the components of a vec3
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a vector to negate
 * @return {!vec3} out
 */
vec3.negate = (out, a) => {
  out[0] = -a[0];
  out[1] = -a[1];
  out[2] = -a[2];
  return out;
};

/**
 * Returns the inverse of the components of a vec3
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a vector to invert
 * @return {!vec3} out
 */
vec3.inverse = (out, a) => {
  out[0] = 1.0 / a[0];
  out[1] = 1.0 / a[1];
  out[2] = 1.0 / a[2];
  return out;
};

/**
 * Normalize a vec3
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a vector to normalize
 * @return {!vec3} out
 */
vec3.normalize = (out, a) => {
  const len = vec3.magnitude(a);
  return len > 0 ? vec3.scale(out, a, 1 / len) : vec3.copy(out, a);
};

/**
 * Calculates the dot product of two vec3's
 *
 * @param {!vec3} a the first operand
 * @param {!vec3} b the second operand
 * @return {number} dot product of a and b
 */
vec3.dot = (a, b) => {
  return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
};

/**
 * Computes the cross product of two vec3's
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a the first operand
 * @param {!vec3} b the second operand
 * @return {!vec3} out
 */
vec3.cross = (out, a, b) => {
  const ax = a[0]; const ay = a[1]; const az = a[2];
  const bx = b[0]; const by = b[1]; const bz = b[2];

  out[0] = ay * bz - az * by;
  out[1] = az * bx - ax * bz;
  out[2] = ax * by - ay * bx;
  return out;
};

/**
 * Computes the cross product of two vec3's
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} origin the relative origin point for a and b
 * @param {!vec3} a the first operand
 * @param {!vec3} b the second operand
 * @return {!vec3} out
 */
vec3.cross2 = (out, origin, a, b) => {
  const ax = a[0] - origin[0]; const ay = a[1] - origin[1]; const az = a[2] - origin[2];
  const bx = b[0] - origin[0]; const by = b[1] - origin[1]; const bz = b[2] - origin[2];

  out[0] = ay * bz - az * by;
  out[1] = az * bx - ax * bz;
  out[2] = ax * by - ay * bx;
  return out;
};

/**
 * Performs a linear interpolation between two vec3's
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a the first operand
 * @param {!vec3} b the second operand
 * @param {number} t interpolation amount, in the range [0-1], between the two inputs
 * @return {!vec3} out
 */
vec3.lerp = (out, a, b, t) => {
  out[0] = a[0] + t * (b[0] - a[0]);
  out[1] = a[1] + t * (b[1] - a[1]);
  out[2] = a[2] + t * (b[2] - a[2]);
  return out;
};

/**
 * Transforms the vec3 with a mat4.
 * 4th vector component is implicitly '1'
 *
 * @param {!vec3} out the receiving vector
 * @param {!vec3} a the vector to transform
 * @param {!mat4} m matrix to transform with
 * @return {!vec3} out
 */
vec3.transformMat4 = (out, a, m) => {
  const x = a[0]; const y = a[1]; const z = a[2];
  let w = m[3] * x + m[7] * y + m[11] * z + m[15];
  w = w || 1.0;
  out[0] = (m[0] * x + m[4] * y + m[8] * z + m[12]) / w;
  out[1] = (m[1] * x + m[5] * y + m[9] * z + m[13]) / w;
  out[2] = (m[2] * x + m[6] * y + m[10] * z + m[14]) / w;
  return out;
};

/**
 * Rotate a 3D vector around the x-axis
 * @param {!vec3} out The receiving vec3
 * @param {!vec3} a The vec3 point to rotate
 * @param {!vec3} b The origin of the rotation
 * @param {number} c The angle of rotation
 * @return {!vec3} out
 */
vec3.rotateX = (out, a, b, c) => {
  const p = []; const r = [];
  // Translate point to the origin
  p[0] = a[0] - b[0];
  p[1] = a[1] - b[1];
  p[2] = a[2] - b[2];

  // perform rotation
  r[0] = p[0];
  r[1] = p[1] * Math.cos(c) - p[2] * Math.sin(c);
  r[2] = p[1] * Math.sin(c) + p[2] * Math.cos(c);

  // translate to correct position
  out[0] = r[0] + b[0];
  out[1] = r[1] + b[1];
  out[2] = r[2] + b[2];

  return out;
};

/**
 * Rotate a 3D vector around the y-axis
 * @param {!vec3} out The receiving vec3
 * @param {!vec3} a The vec3 point to rotate
 * @param {!vec3} b The origin of the rotation
 * @param {number} c The angle of rotation
 * @return {!vec3} out
 */
vec3.rotateY = (out, a, b, c) => {
  const p = []; const r = [];
  // Translate point to the origin
  p[0] = a[0] - b[0];
  p[1] = a[1] - b[1];
  p[2] = a[2] - b[2];

  // perform rotation
  r[0] = p[2] * Math.sin(c) + p[0] * Math.cos(c);
  r[1] = p[1];
  r[2] = p[2] * Math.cos(c) - p[0] * Math.sin(c);

  // translate to correct position
  out[0] = r[0] + b[0];
  out[1] = r[1] + b[1];
  out[2] = r[2] + b[2];

  return out;
};

/**
 * Rotate a 3D vector around the z-axis
 * @param {!vec3} out The receiving vec3
 * @param {!vec3} a The vec3 point to rotate
 * @param {!vec3} b The origin of the rotation
 * @param {number} c The angle of rotation
 * @return {!vec3} out
 */
vec3.rotateZ = (out, a, b, c) => {
  const p = []; const r = [];
  // Translate point to the origin
  p[0] = a[0] - b[0];
  p[1] = a[1] - b[1];
  p[2] = a[2] - b[2];

  // perform rotation
  r[0] = p[0] * Math.cos(c) - p[1] * Math.sin(c);
  r[1] = p[0] * Math.sin(c) + p[1] * Math.cos(c);
  r[2] = p[2];

  // translate to correct position
  out[0] = r[0] + b[0];
  out[1] = r[1] + b[1];
  out[2] = r[2] + b[2];

  return out;
};

/**
 * Get the angle between two 3D vectors
 * @param {!vec3} a The first operand
 * @param {!vec3} b The second operand
 * @return {number} The angle in radians
 */
vec3.angle = (a, b) => {
  const tempA = vec3.fromValues(a[0], a[1], a[2]);
  const tempB = vec3.fromValues(b[0], b[1], b[2]);

  vec3.normalize(tempA, tempA);
  vec3.normalize(tempB, tempB);

  const cosine = vec3.dot(tempA, tempB);

  if (cosine > 1.0) {
    return 0;
  } else if (cosine < -1.0) {
    return Math.PI;
  } else {
    return Math.acos(cosine);
  }
};

/**
 * Returns a string representation of a vector
 *
 * @param {!vec3} a vector to represent as a string
 * @return {string} string representation of the vector
 */
vec3.str = (a) => {
  return 'vec3(' + a[0].toFixed(4) + ', ' + a[1].toFixed(4) + ', ' + a[2].toFixed(4) + ')';
};

/**
 * Returns whether or not the vectors have exactly the same elements in the same position (when compared with ===)
 *
 * @param {!vec3} a The first vector.
 * @param {!vec3} b The second vector.
 * @return {boolean} True if the vectors are equal, false otherwise.
 */
vec3.exactEquals = (a, b) => {
  return a[0] === b[0] && a[1] === b[1] && a[2] === b[2];
};

/**
 * Returns whether or not the vectors have approximately the same elements in the same position.
 *
 * @param {!vec3} a The first vector.
 * @param {!vec3} b The second vector.
 * @return {boolean} True if the vectors are equal, false otherwise.
 */
vec3.equals = (a, b) => {
  const a0 = a[0]; const a1 = a[1]; const a2 = a[2];
  const b0 = b[0]; const b1 = b[1]; const b2 = b[2];
  return (Math.abs(a0 - b0) <= EPSILON * Math.max(1.0, Math.abs(a0), Math.abs(b0)) &&
    Math.abs(a1 - b1) <= EPSILON * Math.max(1.0, Math.abs(a1), Math.abs(b1)) &&
    Math.abs(a2 - b2) <= EPSILON * Math.max(1.0, Math.abs(a2), Math.abs(b2)));
};

// ===== lib/mat4.js =====
// glMatrix - mat4
// https://github.com/toji/gl-matrix/blob/master/src/gl-matrix/mat4.js

/** @typedef {!Float32Array} */
const mat4 = {};

/**
 * Creates a new identity mat4
 *
 * @return {!mat4} a new 4x4 matrix
 */
mat4.create = () => {
  const out = new Float32Array(16);
  out[0] = 1;
  out[5] = 1;
  out[10] = 1;
  out[15] = 1;
  return out;
};

/**
 * Creates a new mat4 initialized with values from an existing matrix
 *
 * @param {!mat4} a matrix to clone
 * @return {!mat4} a new 4x4 matrix
 */
mat4.clone = (a) => {
  const out = new Float32Array(16);
  out[0] = a[0];
  out[1] = a[1];
  out[2] = a[2];
  out[3] = a[3];
  out[4] = a[4];
  out[5] = a[5];
  out[6] = a[6];
  out[7] = a[7];
  out[8] = a[8];
  out[9] = a[9];
  out[10] = a[10];
  out[11] = a[11];
  out[12] = a[12];
  out[13] = a[13];
  out[14] = a[14];
  out[15] = a[15];
  return out;
};

/**
 * Copy the values from one mat4 to another
 *
 * @param {!mat4} out the receiving matrix
 * @param {!mat4} a the source matrix
 * @return {!mat4} out
 */
mat4.copy = (out, a) => {
  out[0] = a[0];
  out[1] = a[1];
  out[2] = a[2];
  out[3] = a[3];
  out[4] = a[4];
  out[5] = a[5];
  out[6] = a[6];
  out[7] = a[7];
  out[8] = a[8];
  out[9] = a[9];
  out[10] = a[10];
  out[11] = a[11];
  out[12] = a[12];
  out[13] = a[13];
  out[14] = a[14];
  out[15] = a[15];
  return out;
};

/**
 * Create a new mat4 with the given values
 *
 * @param {number} m00 Component in column 0, row 0 position (index 0)
 * @param {number} m01 Component in column 0, row 1 position (index 1)
 * @param {number} m02 Component in column 0, row 2 position (index 2)
 * @param {number} m03 Component in column 0, row 3 position (index 3)
 * @param {number} m10 Component in column 1, row 0 position (index 4)
 * @param {number} m11 Component in column 1, row 1 position (index 5)
 * @param {number} m12 Component in column 1, row 2 position (index 6)
 * @param {number} m13 Component in column 1, row 3 position (index 7)
 * @param {number} m20 Component in column 2, row 0 position (index 8)
 * @param {number} m21 Component in column 2, row 1 position (index 9)
 * @param {number} m22 Component in column 2, row 2 position (index 10)
 * @param {number} m23 Component in column 2, row 3 position (index 11)
 * @param {number} m30 Component in column 3, row 0 position (index 12)
 * @param {number} m31 Component in column 3, row 1 position (index 13)
 * @param {number} m32 Component in column 3, row 2 position (index 14)
 * @param {number} m33 Component in column 3, row 3 position (index 15)

  const di = vec3.create();
  const dj = vec3.create();

  // Temp variables for 4 corners of a single quad
  const tmp1 = vec3.create();
  const tmp2 = vec3.create();
  const tmp3 = vec3.create();
  const tmp4 = vec3.create();

  /**
   * Builds a rounded face.
   * @param {!vec3} origin
   * @param {!vec3} topRight
   * @param {!vec3} bottomLeft
   */
  const buildFace = (origin, topRight, bottomLeft) => {
    vec3.subtract(di, topRight, origin);
    vec3.subtract(dj, bottomLeft, origin);

    /**
     * Builds a point for the given i and j.
     * @param {!vec3} out
     * @param {number} i
     * @param {number} j
     */
    const buildPoint = (out, i, j) => {
      vec3.scaleAndAdd(out, origin, di, i / n);
      vec3.scaleAndAdd(out, out, dj, j / n);
      const len = vec3.magnitude(out);
      if (len > maxRadius) {
        vec3.scale(out, out, maxRadius / len);
      }
    };

    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        buildPoint(tmp1, i, j);
        buildPoint(tmp2, i + 1, j);
        buildPoint(tmp3, i + 1, j + 1);
        buildPoint(tmp4, i, j + 1);
        addQuad(data, tmp1, tmp2, tmp3, tmp4);
      }
    }
  };

  // Top
  buildFace(p1, p2, p4);

  // Bottom
  buildFace(p8, p7, p5);

  // Back / South
  buildFace(p2, p1, p6);

  // Front / North
  buildFace(p4, p3, p8);

  // Left / West
  buildFace(p1, p4, p5);

  // Right / East
  buildFace(p3, p2, p7);

  return new Float32Array(data);
};

/**
 * Adds a quad to the buffer set.
 * @param {!Array.<number>} data
 * @param {!vec3} p1
 * @param {!vec3} p2
 * @param {!vec3} p3
 * @param {!vec3} p4
 */
const addQuad = (data, p1, p2, p3, p4) => {
  addTriangle(data, p1, p2, p3);
  addTriangle(data, p1, p3, p4);
};

/**
 * Adds a triangle to the buffer set.
 * @param {!Array.<number>} data
 * @param {!vec3} p1
 * @param {!vec3} p2
 * @param {!vec3} p3
 */
const addTriangle = (data, p1, p2, p3) => {
  addPoint(data, p1);
  addPoint(data, p2);
  addPoint(data, p3);
};

/**
 * Adds a point
 * @param {!Array.<number>} data
 * @param {!vec3} p
 * @return {number}
 */
const addPoint = (data, p) => data.push(...p);

// ===== lib/bufferset.js =====
/**
 * Components refer to the GLSL inputs.
 * They can be 32 bit floats (for vec3 coordinates and transformation matrices),
 * or they can be 32 bit unsigned integers (for colors).
 * @const {number}
 */
const BYTES_PER_COMPONENT = 4;

/**
 * Vertices are simple 3-dimensional vectors.
 * No color or texture data is on the vertex.
 * @const {number}
 */
const COMPONENTS_PER_VERTEX = 3;

/** @const {number} */
const BYTES_PER_VERTEX = COMPONENTS_PER_VERTEX * BYTES_PER_COMPONENT;

/** @const {number} */
const COMPONENTS_PER_MATRIX = 4 * 4;

/** @const {number} */
const BYTES_PER_MATRIX = COMPONENTS_PER_MATRIX * BYTES_PER_COMPONENT;

/**
 * Each instance has one 32-bit color and one 4x4 transofrmation matrix.
 * @const {number}
 */
const COMPONENTS_PER_INSTANCE = 1 + COMPONENTS_PER_MATRIX;

/** @const {number} */
const BYTES_PER_INSTANCE = COMPONENTS_PER_INSTANCE * BYTES_PER_COMPONENT;

/** @typedef {number} */
let GLenum;

/**
 * The BufferSet class represents a collection of WebGL buffers for a render pass.
 *
 * There are 2 buffers:
 * 1) Geometry data.  This is the same for each instance.
 * 2) Instance data.  This is different for each instance.
 *
 * Geometry data includes:
 * 1) Position coordinates (x, y, z) in unit space.
 * 2) That's it.  No color or texture data.
 *
 * Geometry therefore is 3 float components = 12 bytes.
 *
 * Instance data includes:
 * 1) A 32-bit color.
 * 2) Model matrix (4x4 transformation)
 *
 * Instance data therefore is 17 float components = 68 bytes.
 */
class BufferSet {
  /**
   * Creates a new buffer set.
   *
   * @param {!GLenum} usage The usage pattern (either STATIC_DRAW or DYNAMIC_DRAW).
   * @param {!Float32Array} geometry The unit geometry for a single instance.
   * @param {number} maxInstances Maximum number of instances.
   */
  constructor(usage, geometry, maxInstances) {
    /** @const {!GLenum} */
    this.usage = usage;

    /** @const {number} */
    this.verticesPerInstance = geometry.length / COMPONENTS_PER_VERTEX;

    /** @type {number}  */
    this.instanceCount = 0;

    /** @const {!WebGLVertexArrayObject} */
    this.vao = /** @type {!WebGLVertexArrayObject} */ (gl.createVertexArray());
    gl.bindVertexArray(this.vao);

    /** @const {!WebGLBuffer} */
    this.geometryBuffer = /** @type {!WebGLBuffer} */ (gl.createBuffer());

    gl.bindBuffer(ARRAY_BUFFER, this.geometryBuffer);
    gl.bufferData(ARRAY_BUFFER, geometry, STATIC_DRAW);

    // Geometry attributes
    // One vertex is [x, y, z], 3 components, 12 bytes
    gl.enableVertexAttribArray(positionAttrib);
    gl.vertexAttribPointer(positionAttrib, 3, FLOAT, false, BYTES_PER_VERTEX, 0);

    /** @const {!Uint32Array} */
    this.instanceData = new Uint32Array(maxInstances * COMPONENTS_PER_INSTANCE);

    /** @const {!WebGLBuffer} */
    this.instanceBuffer = /** @type {!WebGLBuffer} */ (gl.createBuffer());

    gl.bindBuffer(ARRAY_BUFFER, this.instanceBuffer);
    gl.bufferData(ARRAY_BUFFER, this.instanceData, usage);

    // Instance attributes
    // Colors and model matrices are interleaved
    // One vertex is [color, mat4], 17 components, 68 bytes
    // Actually...
    // In JavaScript code, we refer to color as a single 32-bit number
    // In GLSL code, we refer to color as a vec4, composed of 4 unsigned bytes.
    gl.enableVertexAttribArray(colorAttrib);
    gl.vertexAttribPointer(colorAttrib, 4, UNSIGNED_BYTE, true, BYTES_PER_INSTANCE, 0);
    gl.vertexAttribDivisor(colorAttrib, 1);

    /** @const {!Array.<!mat4>} */
    this.matrices = new Array(maxInstances);
    for (let i = 0; i < maxInstances; i++) {
      // Find the offset for the matrix...
      // Jump to the offset for the instance (i * BYTES_PER_INSTANCE)
      // plus one component for the color (1 * BYTES_PER_COMPONENT)
      const byteOffsetToMatrix = 1 * BYTES_PER_COMPONENT + i * BYTES_PER_INSTANCE;
      this.matrices[i] = new Float32Array(
          this.instanceData.buffer,
          byteOffsetToMatrix,
          COMPONENTS_PER_MATRIX);
    }

    gl.enableVertexAttribArray(worldMatrixAttrib);

    // Set all 4 attributes for matrix
    // Technically a matrix is passed in as 4 separate vec4's
    for (let i = 0; i < 4; i++) {
      const loc = worldMatrixAttrib + i;
      gl.enableVertexAttribArray(loc);
      // Calculate the stride and offset for each matrix row
      // Stride is simple: one stride per instance -> BYTES_PER_INSTANCE
      // Offset is a little more tricky:
      // First, 8 bytes for the texture offset (2 components * 4 bytes per float)
      // Plus i * 16 for 4 floats per row * 4 bytes per float
      const offset = 4 + i * 16;
      gl.vertexAttribPointer(
          loc, // location
          4, // size (num values to pull from buffer per iteration)
          FLOAT, // type of data in buffer
          false, // normalize
          BYTES_PER_INSTANCE, // stride, num bytes to advance to get to next set of values
          offset, // offset in buffer
      );
      // this line says this attribute only changes for each 1 instance
      gl.vertexAttribDivisor(loc, 1);
    }
  }

  /**
   * Resets the buffers to empty state.
   */
  resetBuffers() {
    this.instanceCount = 0;
  }

  /**
   * Adds a new instance to the set.
   * @param {number} color The 32-bit color.
   * @return {!mat4}
   */
  addInstance(color) {
    const i = this.instanceCount++;
    if (DEBUG) {
      if (i * COMPONENTS_PER_INSTANCE >= this.instanceData.length) {
        throw new Error('Out of instances ' +
          '(i=' + i + ', max=' + (this.instanceData.length / COMPONENTS_PER_INSTANCE) + ')');
      }
    }
    this.instanceData[i * COMPONENTS_PER_INSTANCE] = color;
    return mat4.identity(this.matrices[i]);
  }

  /**
   * Updates the WebGL buffers with the current data.
   */
  updateBuffers() {
    gl.bindBuffer(ARRAY_BUFFER, this.instanceBuffer);
    gl.bufferData(ARRAY_BUFFER, this.instanceData, this.usage);
  }

  /**
   * Draws the buffer set.
   */
  render() {
    gl.bindVertexArray(this.vao);

    if (this.usage === DYNAMIC_DRAW) {
      // TODO:  Combine this with updateBuffers
      // Can these be called before bindVertex array?
      // TODO:  Use overload to only update minimum number of elements
      // Use bufferSubData for number of instances * BYTES_PER_INSTANCE
      gl.bindBuffer(ARRAY_BUFFER, this.instanceBuffer);
      // gl.bufferData(ARRAY_BUFFER, this.instanceData, this.usage);
      // void gl.bufferSubData(target, dstByteOffset, ArrayBufferView srcData, srcOffset, length);
      gl.bufferSubData(ARRAY_BUFFER, 0, this.instanceData, 0, this.instanceCount * COMPONENTS_PER_INSTANCE);
    }

    gl.drawArraysInstanced(TRIANGLES, 0, this.verticesPerInstance, this.instanceCount);
  }
}

/**
 * Kills an event by preventing default behavior and stopping all propagation.
 * @param {!Event} e
 */
const killEvent = (e) => {
  e.preventDefault();
  e.stopPropagation();
};

/**
 * Font stacks by script. Comic Sans has no CJK coverage, so CJK locales keep it
 * only as the Latin fallback and lead with a system CJK face.
 * @const {!Object.<string,string>}
 */
const FONT_STACKS = {
  latin: '"Comic Sans MS","Chalkboard SE","Comic Neue",cursive,sans-serif',
  zh: '"Comic Sans MS","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif',
  ja: '"Comic Sans MS","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif',
  ko: '"Comic Sans MS","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif',
};

/**
 * Reads a localStorage key, tolerating environments where storage throws
 * (sandboxed iframes, Safari private mode).
 * @param {string} key
 * @return {?string}
 */
function readStore(key) {
  try {
    const v = localStorage[key];
    return v === undefined ? null : v;
  } catch (e) {
    return null;
  }
}

/**
 * Writes a localStorage key, ignoring failures.
 * @param {string} key
 * @param {string} value
 */
function writeStore(key, value) {
  try {
    localStorage[key] = value;
  } catch (e) {
    // Storage unavailable; state simply will not persist.
  }
}

/**
 * Normalizes a BCP-47 tag to one of LOCALES, or null.
 * @param {string} tag
 * @return {?string}
 */
const matchLocale = (tag) => {
  const lower = String(tag || '').toLowerCase();
  const base = lower.split(/[-_]/)[0];
  return LOCALES.includes(base) ? base : null;
};

/**
 * Resolves the starting locale.
 *
 * Priority: explicit `?lang=` query parameter > previous choice > browser
 * preference > English.
 * @return {string}
 */
const detectLocale = () => {
  let fromQuery = null;
  try {
    fromQuery = new URLSearchParams(location.search).get('lang') ||
      new URLSearchParams(location.hash.replace(/^#/, '?')).get('lang');
  } catch (e) {
    // Malformed URL; fall through to the other sources.
  }
  const q = fromQuery && matchLocale(fromQuery);
  if (q) {
    return q;
  }

  const saved = readStore('callisto-lang');
  if (saved && LOCALES.includes(saved)) {
    return saved;
  }

  for (const tag of (navigator.languages || [navigator.language || 'en'])) {
    const m = matchLocale(tag);
    if (m) {
      return m;
    }
  }
  return 'en';
};

/**
 * Active locale.
 * @type {string}
 */
let locale = detectLocale();

/**
 * Font stack for the active locale.
 * @type {string}
 */
let fontStack = FONT_STACKS[locale] || FONT_STACKS.latin;

/**
 * Switches locale at runtime.
 * @param {string} next
 */
function setLocale(next) {
  const m = matchLocale(next);
  if (!m || m === locale) {
    return;
  }
  locale = m;
  fontStack = FONT_STACKS[locale] || FONT_STACKS.latin;
  writeStore('callisto-lang', locale);
};

/**
 * Looks up a localized string and fills `{n}` placeholders.
 * Falls back to English, then to the key itself, so a missing translation
 * degrades to readable text instead of blank UI.
 * @param {string} key
 * @param {...(string|number)} args
 * @return {string}
 */
function t(key, ...args) {
  const table = STRINGS[locale] || STRINGS.en;
  const raw = table[key] !== undefined ? table[key] : STRINGS.en[key];
  const str = Array.isArray(raw) ? raw.join(' ') : String(raw === undefined ? key : raw);
  return str.replace(/\{(\d+)\}/g, (m, i) => {
    const v = args[Number(i)];
    return v === undefined ? m : String(v);
  });
}

/**
 * Looks up a string authored as an array of lines.
 * @param {string} key
 * @return {!Array.<string>}
 */
function tLines(key) {
  const table = STRINGS[locale] || STRINGS.en;
  const raw = table[key] !== undefined ? table[key] : STRINGS.en[key];
  return Array.isArray(raw) ? raw : [String(raw === undefined ? key : raw), ''];
}

// ===== lib/keyboard.js =====

/**
 * Flag to control whether keyboard inputs are enabled.
 * @const {boolean}
 */
const KEYBOARD_ENABLED = true;

const KEY_COUNT = 256;
const KEY_ENTER = 13;
const KEY_SHIFT = 16;
const KEY_ESCAPE = 27;
const KEY_SPACE = 32;
const KEY_LEFT = 37;
const KEY_UP = 38;
const KEY_RIGHT = 39;
const KEY_DOWN = 40;
const KEY_1 = 49;
const KEY_2 = 50;
const KEY_3 = 51;
const KEY_4 = 52;
const KEY_5 = 53;
const KEY_6 = 54;
const KEY_7 = 55;
const KEY_8 = 56;
const KEY_9 = 57;
const KEY_A = 65;
const KEY_D = 68;
const KEY_M = 77;
const KEY_N = 78;
const KEY_Q = 81;
const KEY_R = 82;
const KEY_S = 83;
const KEY_W = 87;
const KEY_X = 88;
const KEY_Z = 90;

/**
 * Key codes the game actually consumes.
 *
 * Upstream called preventDefault() on *every* keydown, which swallows the
 * browser's own shortcuts (reload, devtools, tabbing out) - hostile and
 * unnecessary. Only suppress the keys we use.
 * @const {!Set.<number>}
 */
const GAME_KEYS = new Set([
  KEY_ENTER, KEY_SHIFT, KEY_ESCAPE, KEY_SPACE,
  KEY_LEFT, KEY_UP, KEY_RIGHT, KEY_DOWN,
  KEY_A, KEY_D, KEY_M, KEY_N, KEY_R, KEY_S, KEY_W, KEY_X, KEY_Z,
]);

/**
 * @typedef {{
 *            down:boolean,
 *            downCount:number,
 *            upCount:number
 *          }}
 */
let Key;

/**
 * Array of keyboard keys.
 * @const {!Array.<!Key>}
 */
const keys = new Array(KEY_COUNT).fill(undefined).map(() => ({down: false, downCount: 0, upCount: 1}));

/**
 * All keys update this key.
 */
const anyKey = {down: false, downCount: 0, upCount: 1};

/**
 * Set by any "confirm" input (key press, mouse click, screen tap) and cleared
 * only when the game consumes it via consumeConfirm().
 *
 * This replaces upstream's `anyKey.upCount === 1` edge test, which required the
 * key *release* to be observed on the very next rendered frame. Any dropped
 * frame - a background tab, a slow first frame while shaders compile, a phone
 * throttling rAF - silently ate the input and left the player staring at a
 * "PRESS ANY KEY TO CONTINUE" screen that did not respond. A latch cannot be
 * missed no matter how the frame timing lands.
 * @type {boolean}
 */
let confirmLatch = false;

/**
 * Real time of the most recent jump request, or -1 if none is pending.
 *
 * Latched for the same reason as confirmLatch. It doubles as standard "jump
 * buffering": a jump pressed just before landing still fires.
 * @type {number}
 */
let jumpLatchTime = -1;

/**
 * How long a buffered jump stays valid, in seconds.
 * @const {number}
 */
const JUMP_BUFFER_TIME = 0.15;

/**
 * Records a confirm input from any device.
 */
function latchConfirm() {
  confirmLatch = true;
}

/**
 * Discards any pending confirm input.
 *
 * Called whenever a menu opens. Taps and key presses during play also set the
 * latch (the input layer cannot know what a press was aimed at), and without
 * this a stale one would dismiss the next death or win screen the instant its
 * half-second guard expired - the player would see the screen flash past.
 */
function clearConfirm() {
  confirmLatch = false;
  jumpLatchTime = -1;
}

/**
 * Consumes a pending confirm input.
 * @return {boolean} True if one was pending.
 */
function consumeConfirm() {
  if (!confirmLatch) {
    return false;
  }
  confirmLatch = false;
  return true;
}

/**
 * Records a jump request from any device.
 */
function latchJump() {
  jumpLatchTime = time;
}

/**
 * Consumes a pending, still-fresh jump request.
 * @return {boolean} True if one was pending.
 */
function consumeJump() {
  if (jumpLatchTime < 0 || time - jumpLatchTime > JUMP_BUFFER_TIME) {
    return false;
  }
  jumpLatchTime = -1;
  return true;
}

/**
 * Updates keyboard state.
 */
const updateKeys = () => {
  anyKey.down = false;
  keys.forEach((k) => {
    if (k.down) {
      anyKey.down = true;
      k.upCount = 0;
      k.downCount++;
    } else {
      k.upCount++;
      k.downCount = 0;
    }
  });

  if (anyKey.down) {
    anyKey.upCount = 0;
    anyKey.downCount++;
  } else {
    anyKey.upCount++;
    anyKey.downCount = 0;
  }
};

/**
 * Resets keyboard to all keys unpressed.
 */
const resetKeys = () => {
  anyKey.down = false;
  keys.forEach((k) => k.down = false);
  confirmLatch = false;
  jumpLatchTime = -1;
  releaseTouchControls();
  updateKeys();
};

/**
 * Returns if the key is down.
 * @param {number} keyCode
 * @return {boolean}
 */
const isKeyDown = (keyCode) => KEYBOARD_ENABLED && keys[keyCode].down;

/**
 * Returns if the key was pressed on this frame.
 * @param {number} keyCode
 * @return {boolean}
 */
const isKeyPressed = (keyCode) => KEYBOARD_ENABLED && keys[keyCode].downCount === 1;

document.addEventListener('keydown', (e) => {
  // Never steal browser or OS shortcuts.
  if (e.ctrlKey || e.metaKey || e.altKey) {
    return;
  }
  const code = e.keyCode;
  if (GAME_KEYS.has(code)) {
    killEvent(e);
  }
  // Guard the array: media keys and some IMEs report codes above 255.
  if (code < KEY_COUNT) {
    if (!keys[code].down) {
      latchConfirm();
      if (code === KEY_Z || code === KEY_SPACE) {
        latchJump();
      }
    }
    keys[code].down = true;
  }
});

document.addEventListener('keyup', (e) => {
  const code = e.keyCode;
  if (GAME_KEYS.has(code)) {
    killEvent(e);
  }
  if (code < KEY_COUNT) {
    keys[code].down = false;
  }
});

window.addEventListener('blur', resetKeys);

// Losing visibility (tab switch, phone lock) stops rAF. Clearing held keys
// avoids coming back to a player sprinting into a pit.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    resetKeys();
  }
});

const OVERLAY_WHITE = '#f0f0f0';
const OVERLAY_BLACK = '#000';
const OVERLAY_LIGHT_GRAY = '#aaa';
const OVERLAY_DARK_GRAY = '#444';
const OVERLAY_YELLOW = '#fffe37';
const OVERLAY_DARK_YELLOW = '#881';
const OVERLAY_GREEN = '#0c0';
const OVERLAY_DARK_GREEN = '#080';
const OVERLAY_ORANGE = '#fe9400';

const ALIGN_LEFT = 'left';
const ALIGN_CENTER = 'center';
const ALIGN_RIGHT = 'right';

/**
 * Draws white text with a black shadow.
 * @param {string} str
 * @param {number} x
 * @param {number} y
 * @param {string=} fillColor
 */
function drawText(str, x, y, fillColor = OVERLAY_BLACK) {
  overlayCtx.fillStyle = fillColor;
  overlayCtx.fillText(str, x, y);
}

/**
 * Draws white text with a black shadow.
 * @param {string} str
 * @param {number} x
 * @param {number} y
 * @param {string=} fillColor
 */
function drawShadowText(str, x, y, fillColor = OVERLAY_WHITE) {
  drawText(str, x + 2, y + 2);
  drawText(str, x, y, fillColor);
}

/**
 * Sets the overlay context font size.
 *
 * The family comes from the active locale rather than being hard-coded to Comic
 * Sans, which has no CJK glyphs - the Chinese, Japanese and Korean builds
 * rendered as boxes until this became locale-aware.
 * @param {number} size
 * @param {string=} style
 */
function setFontSize(size, style = '') {
  overlayCtx.font = `bold ${style} ${size}px ${fontStack}`;
}

/**
 * Draws text shrunk to fit a maximum width.
 *
 * Needed because translations are not the same length as the English original -
 * German and Portuguese in particular overflow boxes sized for English - and
 * silently clipped UI text is worse than slightly smaller UI text.
 * @param {string} str
 * @param {number} x
 * @param {number} y
 * @param {number} maxWidth
 * @param {number} size Preferred font size in pixels.
 * @param {string=} style
 * @param {string=} fillColor
 */
function drawFittedText(str, x, y, maxWidth, size, style = '', fillColor = OVERLAY_WHITE) {
  setFontSize(size, style);
  let width = overlayCtx.measureText(str).width;
  if (width > maxWidth) {
    // One measured correction is enough: canvas text scales linearly with size.
    const shrunk = Math.max(12, Math.floor(size * maxWidth / width));
    setFontSize(shrunk, style);
  }
  drawShadowText(str, x, y, fillColor);
}

/**
 * Sets the overlay context text alignment.
 * @param {string} align
 */
function setTextAlign(align) {
  overlayCtx.textAlign = align;
}

/**
 * Draws a keyboard key icon.
 * @param {string} str
 * @param {number} x
 * @param {number} y
 * @param {number=} width Optional width in pixels.
 */
function drawKeyIcon(str, x, y, width = 36) {
  drawRectangle(x - width / 2, y - 8, width, 36, 'rgba(0,0,0,0.5)', OVERLAY_WHITE);
  drawShadowText(str, x, y);
}

/**
 * Draws a rectangle.
 * @param {number} x
 * @param {number} y
 * @param {number} width
 * @param {number} height
 * @param {string} fillStyle
 * @param {string} strokeStyle
 */
function drawRectangle(x, y, width, height, fillStyle, strokeStyle) {
  overlayCtx.fillStyle = fillStyle;
  overlayCtx.fillRect(x, y, width, height);

/**

const createFbo = (size) => {

  const level = 0;

    // define size and format of level 0

    const border = 0;
    const format = RGBA;

    const data = null;

        size, size, border,
        format, type, data);

    gl.texParameteri(TEXTURE_2D, TEXTURE_WRAP_S, CLAMP_TO_EDGE);

      TEXTURE_2D, // target
      0, // mip level
      DEPTH_COMPONENT32F,
      size, // width
      size, // height
      0, // border
      DEPTH_COMPONENT, // format
      FLOAT, // type
      null); // data

  gl.texParameteri(TEXTURE_2D, TEXTURE_MIN_FILTER, NEAREST);
  gl.texParameteri(TEXTURE_2D, TEXTURE_WRAP_S, CLAMP_TO_EDGE);
  gl.texParameteri(TEXTURE_2D, TEXTURE_WRAP_T, CLAMP_TO_EDGE);

  gl.bindFramebuffer(FRAMEBUFFER, framebuffer);

      FRAMEBUFFER, // target
      COLOR_ATTACHMENT0, // attachment point
      TEXTURE_2D, // texture target
      colorTexture, // texture
      0); // mip level

      FRAMEBUFFER, // target
      DEPTH_ATTACHMENT, // attachment point
      TEXTURE_2D, // texture target
      depthTexture, // texture
      0); // mip level

    size: size,
    colorTexture: colorTexture,
    depthTexture: depthTexture,
    frameBuffer: framebuffer,

};

  vec3.subtract(tempVec, target, source);

  camera.yaw = Math.atan2(tempVec[0], tempVec[2]);
  camera.pitch = Math.atan2(tempVec[1], Math.hypot(tempVec[0], tempVec[2]));

};

  overlayCtx.textBaseline = 'top';

  // Reset the dynamic buffers
  buffers.forEach((b) => b.usage === DYNAMIC_DRAW && b.resetBuffers());

  // Expect the global function "update()"
  update();

  // Update buffer data
  buffers.forEach((b) => b.usage === DYNAMIC_DRAW && b.updateBuffers());

  // Draw the scene twice
  // First, draw from the POV of the light
  bindFbo(shadowFbo);
  resetGl();
  setupCamera(lightSource, shadowFbo.size, shadowFbo.size);
  gl.useProgram(shadowProgram);
  gl.uniformMatrix4fv(projectionMatrixUniform1, false, projectionMatrix);
  gl.uniformMatrix4fv(viewMatrixUniform1, false, modelViewMatrix);
  renderScene();

  // Build the texture matrix that maps the world space to the depth texture
  mat4.identity(shadowMapMatrix);
  mat4.translate(shadowMapMatrix, shadowMapMatrix, vec3.fromValues(0.5, 0.5, 0.5));
  mat4.scale(shadowMapMatrix, shadowMapMatrix, vec3.fromValues(0.5, 0.5, 0.5));
  mat4.multiply(shadowMapMatrix, shadowMapMatrix, projectionMatrix);
  mat4.multiply(shadowMapMatrix, shadowMapMatrix, modelViewMatrix);

  // Second, draw the scene from the POV of the camera
  // Use the shadow map for lighting
  bindFbo(mainFbo);
  resetGl();
  setupCamera(camera, WIDTH, HEIGHT);
  gl.useProgram(mainProgram);
  gl.uniformMatrix4fv(projectionMatrixUniform2, false, projectionMatrix);
  gl.uniformMatrix4fv(viewMatrixUniform2, false, modelViewMatrix);
  gl.uniformMatrix4fv(shadowMapMatrixUniform, false, shadowMapMatrix);
  gl.uniform3fv(lightColorsUniform, lightColors);
  gl.uniform3fv(lightPositionsUniform, lightPositions);
  gl.activeTexture(TEXTURE0);
  gl.bindTexture(TEXTURE_2D, shadowFbo.depthTexture);
  gl.uniform1i(depthTextureSamplerUniform, 0);
  renderScene();

  // Second, draw the scene projecting the depth tecture
  // Use the ping pong technique to render back and forth between two FBOs
  // 6 iteration process:
  //  0 = filter for emissive pixels
  //  1 and 3 = blur horizontally
  //  2 and 4 = blur vertically
  //  5 = result to output
  let inputFbo = mainFbo;
  let outputFbo = pingPongFbo1;
  gl.useProgram(bloomProgram);
  for (let i = 0; i < 5; i++) {
    bindFbo(outputFbo);
    resetGl();
    gl.bindVertexArray(depthOfFieldVao);
    gl.activeTexture(TEXTURE0);
    gl.bindTexture(TEXTURE_2D, inputFbo.colorTexture);
    gl.uniform1i(bloomColorTextureUniform, 0);
    gl.uniform1i(bloomIterationUniform, i);
    gl.drawArrays(TRIANGLES, 0, 6);

    // Swap buffers
    if (i % 2 === 0) {
      inputFbo = pingPongFbo1;
      outputFbo = pingPongFbo2;
    } else {
      inputFbo = pingPongFbo2;
      outputFbo = pingPongFbo1;
    }
  }

  // Lastly, draw the post-processing effects
  // This includes the adding the bloom blur
  // and the depth-of-field blur
  bindScreen();
  gl.useProgram(depthOfFieldProgram);
  gl.clearColor(0, 0, 0, 1.0);
  gl.clear(COLOR_BUFFER_BIT | DEPTH_BUFFER_BIT);
  gl.bindVertexArray(depthOfFieldVao);
  gl.activeTexture(TEXTURE0);
  gl.bindTexture(TEXTURE_2D, mainFbo.colorTexture);
  gl.uniform1i(depthOfFieldColorTextureUniform, 0);
  gl.activeTexture(TEXTURE1);
  gl.bindTexture(TEXTURE_2D, mainFbo.depthTexture);
  gl.uniform1i(depthOfFieldDepthTextureUniform, 1);
  gl.activeTexture(TEXTURE2);
  gl.bindTexture(TEXTURE_2D, pingPongFbo1.colorTexture);
  gl.uniform1i(depthOfFieldBloomTextureUniform, 2);
  gl.drawArrays(TRIANGLES, 0, 6);

  requestAnimationFrame(render);
}
requestAnimationFrame(render);

/**
 * Render the scene using the current camera and buffers.
 */
function renderScene() {
  buffers.forEach((b) => b.render());
}

/**
 * Resets the current lighting values.
 */
function resetLights() {
  lightColors.fill(0);
  lightPositions.fill(0);
  nextLight = 0;
}

/**
 * Adds a light.
 * @param {!vec3} position
 * @param {!vec3} color
 */
function addLight(position, color) {
  lightColors[nextLight * 3] = color[0];
  lightColors[nextLight * 3 + 1] = color[1];
  lightColors[nextLight * 3 + 2] = color[2];
  lightPositions[nextLight * 3] = position[0];
  lightPositions[nextLight * 3 + 1] = position[1];
  lightPositions[nextLight * 3 + 2] = position[2];
  nextLight++;
}

// ===== lib/touch.js =====

// Touch and pointer input.
//
// Upstream had none: the only listeners were document keydown/keyup, so on a
// phone or tablet the game rendered perfectly and then ignored you completely.
// This file adds a floating thumbstick plus action buttons, and routes taps to
// the menus so nothing is keyboard-only any more.
//
// Everything here feeds the *existing* input model - it sets `keys[...].down`
// and calls latchJump()/latchConfirm() - so handleInput() and the menus need
// almost no knowledge that touch exists.

/**
 * True once a real touch has been seen. Controls are hidden until then so
 * desktop players (including touchscreen laptops) never see thumb controls
 * they do not need, and reappear if the player goes back to touching.
 * @type {boolean}
 */
let touchMode = false;

/**
 * Analog movement from the thumbstick, each in [-1, 1].
 * Zero when the stick is not held.
 * @type {number}
 */
let touchMoveX = 0;

/** @type {number} */
let touchMoveZ = 0;

/**
 * Virtual control geometry, in the fixed 1920x1080 overlay space so it scales
 * with the letterboxed canvas on every screen size.
 */
const STICK_HOME_X = 300;
const STICK_HOME_Y = 800;
const STICK_BASE_RADIUS = 130;
const STICK_KNOB_RADIUS = 58;

const BTN_JUMP = {x: 1700, y: 890, r: 105};
const BTN_JETPACK = {x: 1510, y: 700, r: 82};
const BTN_PAUSE = {x: 1700, y: 70, r: 46};
const BTN_MUSIC = {x: 1580, y: 70, r: 46};

/**
 * Region that captures the thumbstick. Deliberately large: on a phone the
 * player should not have to find a small circle.
 * @param {number} x
 * @param {number} y
 * @return {boolean}
 */
const inStickZone = (x, y) => x < 960 && y > 330;

/**
 * Active pointers, keyed by pointerId.
 * Each entry records which control it grabbed so release is unambiguous.
 * @const {!Map.<number, !Object>}
 */
const activePointers = new Map();

/**
 * Where the stick base is currently drawn. Follows the touch that grabbed it
 * (a "floating" stick), which is far more forgiving than a fixed pad.
 */
let stickBaseX = STICK_HOME_X;
let stickBaseY = STICK_HOME_Y;
let stickKnobX = STICK_HOME_X;
let stickKnobY = STICK_HOME_Y;
let stickActive = false;

/**
 * Tap position waiting to be matched against a hit zone, in overlay space.
 * @type {?{x:number, y:number}}
 */
let pendingTap = null;

/**
 * Converts client (CSS pixel) coordinates into overlay canvas coordinates.
 *
 * The canvas is letterboxed and scaled, so this is not identity. Values outside
 * 0..WIDTH / 0..HEIGHT are possible (the black bars) and are handled fine by the
 * zone tests.
 * @param {number} clientX
 * @param {number} clientY
 * @return {!{x:number, y:number}}
 */
function toOverlayCoords(clientX, clientY) {
  const rect = overlayCanvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / rect.width * WIDTH,
    y: (clientY - rect.top) / rect.height * HEIGHT,
  };
}

/**
 * Distance from a point to a circular button's centre.
 * @param {!Object} btn
 * @param {number} x
 * @param {number} y
 * @return {boolean}
 */
const hitsButton = (btn, x, y) => Math.hypot(x - btn.x, y - btn.y) < btn.r * 1.25;

/**
 * Releases every touch-held control.
 * Called on blur / visibility loss, and whenever a level restarts, so a held
 * button cannot survive into a state where the player is not touching it.
 *
 * Declared as a function (not a const arrow) so keyboard.js, which is
 * concatenated earlier, can call it - function declarations hoist.
 */
function releaseTouchControls() {
  activePointers.clear();
  stickActive = false;
  touchMoveX = 0;
  touchMoveZ = 0;
  stickBaseX = stickKnobX = STICK_HOME_X;
  stickBaseY = stickKnobY = STICK_HOME_Y;
  keys[KEY_X].down = false;
}

/**
 * Updates the thumbstick vector from a pointer position.
 * @param {number} x
 * @param {number} y
 */
function updateStick(x, y) {
  const dx = x - stickBaseX;
  const dy = y - stickBaseY;
  const dist = Math.hypot(dx, dy);
  const clamped = Math.min(dist, STICK_BASE_RADIUS);

  if (dist < 1) {
    touchMoveX = 0;
    touchMoveZ = 0;
    stickKnobX = stickBaseX;
    stickKnobY = stickBaseY;
    return;
  }

  const nx = dx / dist;
  const ny = dy / dist;
  stickKnobX = stickBaseX + nx * clamped;
  stickKnobY = stickBaseY + ny * clamped;

  // Small dead zone so resting a thumb does not creep the player off a ledge.
  const magnitude = clamped / STICK_BASE_RADIUS;
  const scaled = magnitude < 0.18 ? 0 : (magnitude - 0.18) / 0.82;

  touchMoveX = nx * scaled;
  // Screen-up is +z in world space (levels run from low z to high z).
  touchMoveZ = -ny * scaled;
}

/**
 * Handles a new pointer contact.
 * @param {!PointerEvent} e
 */
function onPointerDown(e) {
  if (e.pointerType === 'touch') {
    touchMode = true;
  }

  const p = toOverlayCoords(e.clientX, e.clientY);

  // Any contact confirms a menu / story screen. Latched, so it survives frame
  // drops the same way a key press now does.
  latchConfirm();
  pendingTap = p;

  // Only route to the virtual gamepad while actually playing, so a tap meant
  // for a menu is never eaten by an invisible button.
  if (!menu && touchMode) {
    if (hitsButton(BTN_JUMP, p.x, p.y)) {
      activePointers.set(e.pointerId, {control: 'jump'});
      latchJump();
      return;
    }
    if (hitsButton(BTN_JETPACK, p.x, p.y)) {
      activePointers.set(e.pointerId, {control: 'jetpack'});
      keys[KEY_X].down = true;
      return;
    }
    if (hitsButton(BTN_PAUSE, p.x, p.y) || hitsButton(BTN_MUSIC, p.x, p.y)) {
      // Handled on release, so a mis-touch can be slid off and cancelled.
      activePointers.set(e.pointerId, {control: hitsButton(BTN_PAUSE, p.x, p.y) ? 'pause' : 'music'});
      return;
    }
    if (inStickZone(p.x, p.y) && !stickActive) {
      stickActive = true;
      stickBaseX = p.x;
      stickBaseY = p.y;
      activePointers.set(e.pointerId, {control: 'stick'});
      updateStick(p.x, p.y);
      return;
    }
  }

  activePointers.set(e.pointerId, {control: 'none'});
}

/**
 * Handles pointer movement.
 * @param {!PointerEvent} e
 */
function onPointerMove(e) {
  const entry = activePointers.get(e.pointerId);
  if (!entry || entry.control !== 'stick') {
    return;
  }
  const p = toOverlayCoords(e.clientX, e.clientY);
  updateStick(p.x, p.y);
}

/**
 * Handles pointer release / cancel.
 * @param {!PointerEvent} e
 */
function onPointerUp(e) {
  const entry = activePointers.get(e.pointerId);
  activePointers.delete(e.pointerId);
  if (!entry) {
    return;
  }

  if (entry.control === 'stick') {
    stickActive = false;
    touchMoveX = 0;
    touchMoveZ = 0;
    stickBaseX = stickKnobX = STICK_HOME_X;
    stickBaseY = stickKnobY = STICK_HOME_Y;
  } else if (entry.control === 'jetpack') {
    keys[KEY_X].down = false;
  } else if (entry.control === 'pause') {
    const p = toOverlayCoords(e.clientX, e.clientY);
    if (hitsButton(BTN_PAUSE, p.x, p.y)) {
      requestPauseMenu();
    }
  } else if (entry.control === 'music') {
    const p = toOverlayCoords(e.clientX, e.clientY);
    if (hitsButton(BTN_MUSIC, p.x, p.y)) {
      toggleBackgroundMusic();
    }
  }
}

window.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);

// Leaving touch idle and going back to the keyboard hides the thumb controls.
document.addEventListener('keydown', () => {
  if (touchMode) {
    touchMode = false;
    releaseTouchControls();
  }
});

/**
 * Tests a pending tap against a rectangle, consuming it on a hit.
 *
 * Menus call this as they draw each row, which keeps hit regions and painted
 * text in one place and impossible to desynchronise.
 * @param {number} x
 * @param {number} y
 * @param {number} w
 * @param {number} h
 * @return {boolean} True if a tap landed inside.
 */
function takeTapIn(x, y, w, h) {
  if (!pendingTap) {
    return false;
  }
  if (pendingTap.x >= x && pendingTap.x <= x + w &&
      pendingTap.y >= y && pendingTap.y <= y + h) {
    pendingTap = null;
    return true;
  }
  return false;
}

/**
 * Drops any tap that no menu row claimed this frame.
 * Without this a tap could linger and fire on a later, unrelated screen.
 */
function clearPendingTap() {
  pendingTap = null;
}

/**
 * Draws one round virtual button.
 * @param {!Object} btn
 * @param {string} glyph
 * @param {boolean} pressed
 * @param {number=} glyphSize
 */
function drawTouchButton(btn, glyph, pressed, glyphSize = 46) {
  overlayCtx.beginPath();
  overlayCtx.arc(btn.x, btn.y, btn.r, 0, 2 * Math.PI);
  overlayCtx.fillStyle = pressed ? 'rgba(255,254,55,0.35)' : 'rgba(0,0,0,0.35)';
  overlayCtx.fill();
  overlayCtx.strokeStyle = pressed ? OVERLAY_YELLOW : 'rgba(240,240,240,0.75)';
  overlayCtx.lineWidth = 4;
  overlayCtx.stroke();

  const prevBaseline = overlayCtx.textBaseline;
  overlayCtx.textBaseline = 'middle';
  setTextAlign(ALIGN_CENTER);
  setFontSize(glyphSize);
  drawShadowText(glyph, btn.x, btn.y);
  overlayCtx.textBaseline = prevBaseline;
}

/**
 * Draws the on-screen controls. No-op until a touch has been seen.
 */
function drawTouchControls() {
  if (!touchMode) {
    return;
  }

  // Thumbstick
  overlayCtx.beginPath();
  overlayCtx.arc(stickBaseX, stickBaseY, STICK_BASE_RADIUS, 0, 2 * Math.PI);
  overlayCtx.fillStyle = 'rgba(0,0,0,0.25)';
  overlayCtx.fill();
  overlayCtx.strokeStyle = 'rgba(240,240,240,0.5)';
  overlayCtx.lineWidth = 4;
  overlayCtx.stroke();

  overlayCtx.beginPath();
  overlayCtx.arc(stickKnobX, stickKnobY, STICK_KNOB_RADIUS, 0, 2 * Math.PI);
  overlayCtx.fillStyle = stickActive ? 'rgba(255,254,55,0.55)' : 'rgba(240,240,240,0.45)';
  overlayCtx.fill();
  overlayCtx.strokeStyle = 'rgba(240,240,240,0.85)';
  overlayCtx.stroke();

  const jumpHeld = [...activePointers.values()].some((p) => p.control === 'jump');
  drawTouchButton(BTN_JUMP, '⤒', jumpHeld, 64);
  drawTouchButton(BTN_JETPACK, '🚀', keys[KEY_X].down, 54);
  drawTouchButton(BTN_PAUSE, '⏸', false, 34);
  drawTouchButton(BTN_MUSIC, backgroundMusicEnabled() ? '🔊' : '🔇', false, 30);
}

// ===== entities/entity.js =====

/**
 * The GameEntity class represents an entity in the game.
 */
class GameEntity {
  /**
   * Creates a new game entity.
   * @param {number=} x
   * @param {number=} y
   * @param {number=} z
   */
  constructor(x, y, z) {
    /** @const {!vec3} */
    this.pos = vec3.fromValues(x || 0, y || 0, z || 0);

    /** @const {!vec3} */
    this.velocity = vec3.create();

    /** @const {!mat4} */
    this.transformMatrix = mat4.create();

    /** @type {number} */
    this.health = 100;

    /** @type {number} */
    this.yaw = 0;

    /** @type {boolean} */
    this.accelerating = false;

    /** @type {number} */
    this.groundedTime = 0;

    /** @type {?Platform} */
    this.groundedPlatform = null;

    /** @type {number} */
    this.shootTime = 0;

    /** @type {number} */
    this.bounciness = 0.0;

    /** @type {!Array.<!vec3>} */
    this.waypoints = [];

    /** @type {number} */
    this.waypointIndex = 0;

    /** @type {boolean} */
    this.rendered = true;
  }

  /**
   * Returns true if the entity is on the ground.
   * @return {boolean}
   */
  isGrounded() {
    return this.groundedTime === gameTime;
  }

  /**
   * Returns true if the entity can jump.
   * @return {boolean}
   */
  canShoot() {
    return (gameTime - this.shootTime) > 0.5;
  }

  /**
   * Launches the player.
   */
  jump() {
    this.velocity[1] = JUMP_POWER;
    this.groundedTime = 0;
    this.groundedPlatform = null;
    if (this === player) {
      playJumpSound();
    }
  }

  /**
   * Updates the entity.
   * By default, does nothing.
   */
  update() {
    // Subclasses should override
  }

  /**
   * Renders the entity.
   * By default, does nothing.
   * Static entities can use this default implementation.
   */
  render() {
    // Subclasses should override
  }

  /**
   * Returns the distance to the player.
   * @return {number} Distance to the player.
   */
  getDistanceToPlayer() {
    if (player.health <= 0) {
      return 1000;
    }
    return vec3.distance(player.pos, this.pos);
  }

  /**
   * Updates waypoints.
   * Silently ignores if no waypoints are setup.
   * @return {?vec3} The current waypoint if available.
   */
  updateWaypoints() {
    if (this.waypoints.length === 0) {
      return null;
    }
    const waypoint = this.waypoints[this.waypointIndex];
    if (vec3.distance(this.pos, waypoint) < 0.1) {
      this.waypointIndex = (this.waypointIndex + 1) % this.waypoints.length;
    }
    return waypoint;
  }

  /**
   * Sets up the default transform matrix.
   */
  setupTransformMatrix() {
    const theta = time * 20;
    const speed = Math.hypot(this.velocity[0], this.velocity[2]);
    const bodyOffsetY = this.bounciness * Math.sin(theta) * speed;
    const bodyRotationX = 0.02 * speed;

    vec3.copy(tempVec, this.pos);

    if (this.isGrounded()) {
      tempVec[1] += bodyOffsetY;
    }

    mat4.identity(this.transformMatrix);
    mat4.translate(this.transformMatrix, this.transformMatrix, tempVec);
    mat4.rotateY(this.transformMatrix, this.transformMatrix, this.yaw);
    mat4.rotateX(this.transformMatrix, this.transformMatrix, bodyRotationX);
  }

  /**
   * Creates a new sphere transformed to instance space.
   * @param {number} color
   * @return {!mat4}
   */
  createSphere(color) {
    const m = buffers[DYNAMIC_SPHERES].addInstance(color);
    mat4.multiply(m, m, this.transformMatrix);
    return m;
  }
}

// ===== entities/alien.js =====

/**
 * The Alien class represents a small mostly harmless enemy.
 */
class Alien extends GameEntity {
  /**
   * Creates a new alien.
   * @param {number=} x
   * @param {number=} y
   * @param {number=} z
   */
  constructor(x, y, z) {
    super(x, y, z);

    /**
     * Alien acceleration power in meters per second per second.
     * @type {number}
     */
    this.acceleration = 60.0;

    /**
     * Distance from player before aggro.
     * @type {number}
     */
    this.aggroRange = 15;

    /**
     * Alien color.
     * @type {number}
     */
    this.color = COLOR_ALIEN_GREEN;

    this.bounciness = 0.01;
  }

  /**
   * Updates the alien.
   * @override
   */
  update() {
    const waypoint = this.updateWaypoints();
    const dist = this.getDistanceToPlayer();
    if (dist < 1.5) {
      if (player.pos[1] > this.pos[1]) {
        this.health = 0;
        player.pos[1] = this.pos[1] + 2.0;
        player.jump();
        createExplosion(this.pos, this.color, 15);
      } else {
        player.health = 0;
        player.rendered = false;
        playerDie();
        createExplosion(player.pos, this.color);
      }
    } else if (dist < this.aggroRange) {
      // Walk toward player
      vec3.subtract(tempVec, player.pos, this.pos);
      tempVec[1] = 0;
      vec3.normalize(tempVec, tempVec);
      vec3.scaleAndAdd(this.velocity, this.velocity, tempVec, dt * this.acceleration);
    } else if (waypoint) {
      // Walk toward waypoint
      vec3.subtract(tempVec, waypoint, this.pos);
      vec3.normalize(tempVec, tempVec);
      vec3.scaleAndAdd(this.velocity, this.velocity, tempVec, dt * this.acceleration);
    }
    updateEntity(this);
  }

  /**
   * Renders the alien.
   * @override
   */
  render() {
    // Draw alien main body
    {
      const m = this.createSphere(this.color);
      mat4.translate(m, m, vec3.fromValues(0, 0.8, 0));
      mat4.scale(m, m, vec3.fromValues(0.8, 0.8, 0.7));
    }

    // Draw left eye
    {
      const m = this.createSphere(COLOR_BLACK);
      mat4.translate(m, m, vec3.fromValues(-0.25, .9, 0.7));
      mat4.rotateZ(m, m, -1);
      mat4.scale(m, m, vec3.fromValues(0.2, 0.1, 0.025));
    }

    // Draw right eye
    {
      const m = this.createSphere(COLOR_BLACK);
      mat4.translate(m, m, vec3.fromValues(0.25, .9, 0.7));
      mat4.rotateZ(m, m, 1);
      mat4.scale(m, m, vec3.fromValues(0.2, 0.1, 0.025));
    }
  }
}

// ===== entities/coin.js =====

/**
 * The Coin class represents a gold coin that the player can pick up.
 */
class Coin extends GameEntity {
  /**
   * Updates the coin.
   * @override
   */
  update() {
    const dist = this.getDistanceToPlayer();
    if (dist < 1.0) {
      // Give the player a coin
      this.health = 0;
      coins++;
      coinSequence++;
      lastCoinTime = gameTime;
      playCoinSound();
    } else if (dist < 3) {
      // Move the coin toward the player
      this.pos[0] = 0.9 * this.pos[0] + 0.1 * player.pos[0];
      this.pos[1] = 0.9 * this.pos[1] + 0.1 * player.pos[1];
      this.pos[2] = 0.9 * this.pos[2] + 0.1 * player.pos[2];
    }
  }

  /**
   * Renders the coin.
   * @override
   */
  render() {
    const r = (time % 1.0) * 2 * Math.PI;
    const y = 1.5 + 0.2 * Math.sin(r);
    const m = this.createSphere(COLOR_YELLOW);
    mat4.translate(m, m, vec3.fromValues(0, y, 0));
    mat4.rotateY(m, m, r);
    mat4.scale(m, m, vec3.fromValues(0.5, 0.5, 0.1));
  }
}

/**
 * The Flagpole class represents the flag goal of the level.
 */
class Flagpole extends GameEntity {
  /**
   * Creates a new flagpole.
   * @param {number=} x
   * @param {number=} y
   * @param {number=} z
   */
  constructor(x, y, z) {
    super(x, y, z);
    this.triggered = false;
  }
  /**
   * Updates the flagpole.
   *
   * Upstream required `coins === availableCoins`: every single pickup, or the
   * transporter did nothing at all and said nothing about why. Standing on the
   * goal watching it ignore you is the most common way this game reads as
   * broken. The gate is now a majority (see REQUIRED_STAR_FRACTION), the HUD
   * states the shortfall continuously, and collecting everything is what earns
   * the second star instead of what unlocks the door.
   * @override
   */
  update() {
    const dist = this.getDistanceToPlayer();
    if (dist < 2.0 && !this.triggered && coins >= requiredCoins()) {
      playMusic(flagpoleSongData);
      lastRunStars = completeLevel(level, coins, availableCoins, gameTime);
      addTrophy(`Level ${level}`, `${gameTime.toFixed(1)} sec`);
      stopJetpackSound();
      setMenu(winScreen);
      gameState = GameState.AFTER_LEVEL;
      this.triggered = true;
    }
  }

  /**
   * Renders the flagpole.
   * @override
   */
  render() {
    const r = (time % 1.0) * 2 * Math.PI;
    const y = 4.7 + 0.1 * Math.sin(r);

    // Main flag pole
    {
      const m = this.createSphere(COLOR_SILVER);
      mat4.translate(m, m, vec3.fromValues(0, 2.5, 0));
      mat4.scale(m, m, vec3.fromValues(0.2, 2.5, 0.2));
    }

    // Base
    {
      const m = this.createSphere(COLOR_SILVER);
      mat4.scale(m, m, vec3.fromValues(0.5, 0.5, 0.5));
    }

    // Red ball on top
    {
      const m = this.createSphere(COLOR_RED);
      mat4.translate(m, m, vec3.fromValues(0, y, 0));
      mat4.rotateY(m, m, r);
      mat4.scale(m, m, vec3.fromValues(0.5, 0.5, 0.5));
    }
  }
}

/**
 * The Fuel class represents a jetpack fuel that the player can pick up.
 */
class Fuel extends GameEntity {
  /**
   * Creates a new game entity.
   * @param {number} x
   * @param {number} y
   * @param {number} z
   * @param {number=} amount
   */
  constructor(x, y, z, amount) {
    super(x, y, z);
    this.amount = amount || 30;
  }

  /**
   * Updates the Fuel.
   * @override
   */
  update() {
    const dist = this.getDistanceToPlayer();
    if (dist < 1.0) {
      // Increase player jetpack fuel
      player.fuel += this.amount;
      this.health = 0;
      this.amount = 0;
      playFuelSound();
    } else if (dist < 4) {
      // Move the Fuel toward the player
      this.pos[0] = 0.9 * this.pos[0] + 0.1 * player.pos[0];
      this.pos[1] = 0.9 * this.pos[1] + 0.1 * player.pos[1];
      this.pos[2] = 0.9 * this.pos[2] + 0.1 * player.pos[2];
    }
  }

  /**
   * Renders the Fuel.
   * @override
   */
  render() {
    const r = (time % 1.0) * 2 * Math.PI;
    const y = 1.5 + 0.2 * Math.sin(r);

    // Draw left jetpack
    {
      const m = this.createSphere(COLOR_DARK_SILVER);
      mat4.translate(m, m, vec3.fromValues(-0.24, y, 0));
      mat4.rotateY(m, m, r);
      mat4.scale(m, m, vec3.fromValues(0.3, 0.64, 0.3));

    // Draw right jetpack

      mat4.rotateY(m, m, r);

/**
 * Hero
 */
class Hero extends GameEntity {
  /**
   * Creates a new astronaut / hero.
   * @param {number=} x
   * @param {number=} y
   * @param {number=} z
   */
  constructor(x, y, z) {
    super(x, y, z);
    this.bounciness = 0.01;
    this.fuel = 100;
    this.jetpack = false;
  }

  /**
   * Renders the player model.
   * @override
   */
  render() {
    let leftArmRotationX = 0.0;
    let leftArmRotationZ = 1.2;
    let rightArmRotationX = 0.0;
    let rightArmRotationZ = -1.2;
    let leftLegRotationX = 0;
    let rightLegRotationX = 0;

    if (!this.isGrounded() || gameState === GameState.AFTER_LEVEL) {
      // Jumping = arms up
      leftArmRotationZ = -0.5;
      rightArmRotationZ = 0.5;
    } else if (this.accelerating) {
      // Running = arms back
      const r = (gameTime % 0.8) / 0.8 * 2 * Math.PI;
      rightLegRotationX = leftArmRotationX = 0.07 * Math.hypot(this.velocity[0], this.velocity[2]) * Math.sin(r);
      rightArmRotationX = leftLegRotationX = -leftArmRotationX;
      leftArmRotationZ = 1.2;
      rightArmRotationZ = -1.2;
    }

    // Draw face
    {
      const m = this.createSphere(COLOR_ORANGE);
      mat4.translate(m, m, vec3.fromValues(0, 1.8, 0));
      mat4.scale(m, m, vec3.fromValues(0.38, 0.38, 0.38));
    }

    // Draw helmet
    {
      const m = this.createSphere(COLOR_WHITE);
      mat4.translate(m, m, vec3.fromValues(0, 1.8, -0.08));
      mat4.scale(m, m, vec3.fromValues(0.45, 0.5, 0.38));
    }

    // Draw stomach
    {
      const m = this.createSphere(COLOR_WHITE);
      mat4.translate(m, m, vec3.fromValues(0, 1.05, 0));
      mat4.scale(m, m, vec3.fromValues(0.3, 0.47, 0.27));
    }

    // Draw left jetpack
    {
      const m = this.createSphere(COLOR_DARK_SILVER);
      mat4.translate(m, m, vec3.fromValues(-0.12, 1.2, -0.35));
      mat4.scale(m, m, vec3.fromValues(0.15, 0.32, 0.15));
    }

    // Draw right jetpack
    {
      const m = this.createSphere(COLOR_DARK_SILVER);
      mat4.translate(m, m, vec3.fromValues(0.12, 1.2, -0.35));
      mat4.scale(m, m, vec3.fromValues(0.15, 0.32, 0.15));
    }

    if (this.jetpack) {
      const m = this.createSphere(0xFF00A0FF);
      mat4.translate(m, m, vec3.fromValues(0, 0.9, -0.35));
      mat4.scale(m, m, vec3.fromValues(0.2, 0.2, 0.2));
      addLight(vec3.fromValues(this.pos[0], this.pos[1]+1, this.pos[2]), vec3.fromValues(1, 0.75, 0));
    }

    // Draw left arm
    {
      const m = this.createSphere(COLOR_WHITE);
      mat4.translate(m, m, vec3.fromValues(-.3, 1.4, 0));
      mat4.rotateX(m, m, leftArmRotationX);
      mat4.rotateZ(m, m, leftArmRotationZ);
      mat4.translate(m, m, vec3.fromValues(-.4, 0, 0));
      mat4.scale(m, m, vec3.fromValues(0.4, 0.16, 0.16));
    }

    // Draw right arm
    {
      const m = this.createSphere(COLOR_WHITE);
      mat4.translate(m, m, vec3.fromValues(0.3, 1.4, 0));
      mat4.rotateX(m, m, rightArmRotationX);
      mat4.rotateZ(m, m, rightArmRotationZ);
      mat4.translate(m, m, vec3.fromValues(.4, 0, 0));
      mat4.scale(m, m, vec3.fromValues(0.4, 0.16, 0.16));
    }

    // Draw left leg
    {
      const m = this.createSphere(COLOR_WHITE);
      mat4.translate(m, m, vec3.fromValues(0.0, 1.1, 0.0));
      mat4.rotateX(m, m, leftLegRotationX);
      mat4.translate(m, m, vec3.fromValues(-0.21, -0.6, 0.0));
      mat4.scale(m, m, vec3.fromValues(0.18, 0.6, 0.18));
    }

    // Draw right leg
    {
      const m = this.createSphere(COLOR_WHITE);
      mat4.translate(m, m, vec3.fromValues(0, 1.1, 0.0));
      mat4.rotateX(m, m, rightLegRotationX);
      mat4.translate(m, m, vec3.fromValues(0.21, -0.6, 0.0));
      mat4.scale(m, m, vec3.fromValues(0.18, 0.6, 0.18));
    }
  }
}

/**
 * Kang is the final boss.
 */
class Kang extends GameEntity {
  /**
   * Creates Kang.
   */
  constructor() {
    super(16, 5, 16);

    /**
     * The next time Kang will shoot.
     * When gameTime > nextShootTime, Kang shoots,
     * and then the time is reset.
     */
    this.nextShootTime = 0;
  }

  /**
   * Updates Kang.
   * @override
   */
  update() {
    // Face the player
    this.yaw = Math.atan2(player.pos[0] - this.pos[0], player.pos[2] - this.pos[2]);

    // Float up and down
    this.pos[1] = player.pos[1] + 6.0 + Math.sin(time * 2);
    this.velocity[1] = 0;

    if (gameState === GameState.PLAYING &&
      gameTime > this.nextShootTime &&
      player.health > 0) {
      const projectile = new Particle();
      projectile.projectile = ProjectileType.Enemy;
      projectile.color = 0xFF4040FF;
      projectile.deathRate = 10;
      projectile.lightColor = vec3.fromValues(1.0, 0.0, 0.0);
      projectile.size = 0.5;
      vec3.copy(projectile.pos, this.pos);
      projectile.pos[1] += 3.0;
      const target = vec3.fromValues(player.pos[0], player.pos[1] + 1, player.pos[2]);
      vec3.subtract(projectile.velocity, target, projectile.pos);
      vec3.normalize(projectile.velocity, projectile.velocity);
      vec3.scale(projectile.velocity, projectile.velocity, 40);
      entities.push(projectile);
      this.nextShootTime = gameTime + 5;
      playKangShootSound();
    }
  }

  /**
   * Renders the Kang.
   * @override
   */
  render() {
    mat4.identity(this.transformMatrix);
    mat4.translate(this.transformMatrix, this.transformMatrix, this.pos);
    mat4.rotateY(this.transformMatrix, this.transformMatrix, this.yaw);

    // Draw Kang main body
    {
      const m = this.createSphere(COLOR_ALIEN_GREEN);
      mat4.scale(m, m, vec3.fromValues(3, 7, 3));
    }

    // Draw white of eye
    {
      const m = this.createSphere(COLOR_KANG_EYE_YELLOW);
      mat4.translate(m, m, vec3.fromValues(0, 3, 1.2));
      mat4.scale(m, m, vec3.fromValues(2, 2, 2));
    }

    // Draw black of eye
    {
      const remaining = this.nextShootTime - gameTime;
      const charge = Math.min((5.0 - remaining) / 4.5, 1.0);
      const color = 0xFF333333 + charge * 0xCC;
      const m = this.createSphere(color);
      mat4.translate(m, m, vec3.fromValues(0, 3, 3));
      mat4.scale(m, m, vec3.fromValues(0.5, 1.2, 0.3));
    }

    // Draw tentacles
    for (let i = 0; i < 10; i++) {
      const m = this.createSphere(COLOR_ALIEN_GREEN);
      mat4.rotateY(m, m, i / 10 * Math.PI * 2);
      mat4.rotateX(m, m, 0.5 + 0.4 * Math.sin(time * 4 + i));
      mat4.translate(m, m, vec3.fromValues(0, -2, 4));
      mat4.scale(m, m, vec3.fromValues(0.5, 0.5, 4));
    }
  }
}

// ===== entities/particle.js =====

/**
 * Projectile types.
 * @enum {number}
 */
const ProjectileType = {
  None: 0,
  Player: 1,
  Enemy: 2,
};

/**
 * The Particle class represents a purely visual entity.
 * Particles are used for:
 *   1) Floaties - small specks that rise slowly and fade away.
 *   2) Running dust - dust clouds when entities run around.
 *   3) Explosion particles - flying everywhere.
 */
class Particle extends GameEntity {
  /**
   * Creates a new particle.
   * @param {number=} x
   * @param {number=} y
   * @param {number=} z
   */
  constructor(x, y, z) {
    super(x, y, z);

    /** @type {number} */
    this.size = 0.2;

    /** @type {number} */
    this.deathRate = 100;

    /** @type {number} */
    this.color = COLOR_WHITE;

    /** @const {!vec3} */
    this.acceleration = vec3.create();

    /** @type {?vec3} */
    this.lightColor = null;

    /** @type {!ProjectileType} */
    this.projectile = ProjectileType.None;
  }

  /**
   * Updates the particle.
   * @override
   */
  update() {
    vec3.scaleAndAdd(this.velocity, this.velocity, this.acceleration, dt);
    vec3.scaleAndAdd(this.pos, this.pos, this.velocity, dt);
    this.health -= dt * this.deathRate;
  }

  /**
   * Renders the particle.
   * @override
   */
  render() {
    const radius = this.size * (this.health / 100);
    const m = this.createSphere(this.color);
    mat4.scale(m, m, vec3.fromValues(radius, radius, radius));

    if (this.lightColor) {
      addLight(this.pos, this.lightColor);
    }
  }
}

/**
 * The Platform class represents something that other entities can stand on.
 * Platforms can be stationary or moving.
 */
class Platform extends GameEntity {
  /**
   * Creates a new particle.
   * @param {number=} x
   * @param {number=} y
   * @param {number=} z
   */
  constructor(x, y, z) {
    super(x, y, z);

    /** @type {number} */
    this.color = COLOR_SILVER;

    /** @const {!vec3} */
    this.scale = vec3.fromValues(1, 1, 1);

    /** @type {!Array.<!vec3>} */
    this.waypoints = [];

    /** @type {number} */
    this.waypointIndex = 0;
  }

  /**
   * Updates the platform.
   * @override
   */
  update() {
    const waypoint = this.updateWaypoints();
    if (waypoint) {
      vec3.subtract(this.velocity, waypoint, this.pos);
      vec3.normalize(this.velocity, this.velocity);
      vec3.scale(this.velocity, this.velocity, 6.0);
      vec3.scaleAndAdd(this.pos, this.pos, this.velocity, dt);
    }
  }

  /**
   * Renders the platform.
   * @override
   */
  render() {
    if (this.waypoints.length > 0) {
      // Draw lift
      {
        // Draw yellow base
        const m = buffers[DYNAMIC_CUBES].addInstance(COLOR_YELLOW);
        mat4.multiply(m, m, this.transformMatrix);
        mat4.scale(m, m, this.scale);
      }
      {
        // Black center stripe
        const m = buffers[DYNAMIC_CUBES].addInstance(COLOR_BLACK);
        mat4.multiply(m, m, this.transformMatrix);
        mat4.rotateY(m, m, Math.PI / 4);
        mat4.scale(m, m, vec3.fromValues(2.5, 0.31, 0.32));
      }
      {
        // Left corner stripe
        const m = buffers[DYNAMIC_CUBES].addInstance(COLOR_BLACK);
        mat4.multiply(m, m, this.transformMatrix);
        mat4.rotateY(m, m, Math.PI / 4);
        mat4.translate(m, m, vec3.fromValues(0, 0, -1.2));
        mat4.scale(m, m, vec3.fromValues(1.35, 0.31, 0.32));

        // Right corner stripe
        const m = buffers[DYNAMIC_CUBES].addInstance(COLOR_BLACK);
        mat4.multiply(m, m, this.transformMatrix);
        mat4.rotateY(m, m, Math.PI / 4);
        mat4.translate(m, m, vec3.fromValues(0, 0, 1.2));
        mat4.scale(m, m, vec3.fromValues(1.35, 0.31, 0.32));
      }

      {
        // South border
        const m = buffers[DYNAMIC_CUBES].addInstance(COLOR_BLACK);
        mat4.multiply(m, m, this.transformMatrix);
        mat4.translate(m, m, vec3.fromValues(0, 0, -1.82));
        mat4.scale(m, m, vec3.fromValues(2.04, 0.32, 0.2));
      }
      {
        // North border

        mat4.multiply(m, m, this.transformMatrix);
        mat4.translate(m, m, vec3.fromValues(0, 0, 1.82));
        mat4.scale(m, m, vec3.fromValues(2.04, 0.32, 0.2));
      }
      {
        // West border

        mat4.multiply(m, m, this.transformMatrix);
        mat4.translate(m, m, vec3.fromValues(-1.82, 0, 0));

/**
 * Shooter is a mid level shooting enemy.
 */
class Shooter extends GameEntity {
  /**
   * Creates Shooter.
   * @param {number} x
   * @param {number} y
   * @param {number} z
   * @param {number} yaw
   * @param {number} nextShootTime
   */
  constructor(x, y, z, yaw, nextShootTime) {
    super(x, y, z);

    this.yaw = yaw;

    /**
     * The next time Shooter will shoot.
     * When gameTime > nextShootTime, Shooter shoots,
     * and then the time is reset.
     */
    this.nextShootTime = nextShootTime;
  }

  /**
   * Updates Shooter.
   * @override
   */
  update() {
    // Float up and down
    this.pos[1] += dt * 0.5 * Math.sin(time * 2);
    this.velocity[1] = 0;

    if (gameState === GameState.PLAYING &&
      gameTime > this.nextShootTime &&
      player.health > 0) {
      const projectile = new Particle();
      projectile.projectile = ProjectileType.Enemy;
      projectile.color = 0xFF4040FF;
      projectile.deathRate = 10;
      projectile.lightColor = vec3.fromValues(1.0, 0.0, 0.0);
      projectile.size = 0.5;
      vec3.copy(projectile.pos, this.pos);
      projectile.pos[1] += 0.75;
      vec3.rotateY(projectile.velocity, forward, origin, this.yaw);
      vec3.scale(projectile.velocity, projectile.velocity, 20);
      entities.push(projectile);
      this.nextShootTime = gameTime + 5;
      playKangShootSound();
    }
  }

  /**
   * Renders the alien.
   * @override
   */
  render() {
    mat4.identity(this.transformMatrix);
    mat4.translate(this.transformMatrix, this.transformMatrix, this.pos);
    mat4.rotateY(this.transformMatrix, this.transformMatrix, this.yaw);

    // Draw main body

      const m = this.createSphere(COLOR_ALIEN_GREEN);

      mat4.scale(m, m, vec3.fromValues(0.5, 0.5, 0.5));
    }

    // Draw the jet
    {
      const m = this.createSphere(0xFF00A0FF);
      mat4.translate(m, m, vec3.fromValues(0, -.2, 0));
      mat4.scale(m, m, vec3.fromValues(0.3, 0.3, 0.3));
    }

    // Draw left eye
    {
      const m = this.createSphere(COLOR_BLACK);
      mat4.translate(m, m, vec3.fromValues(-0.25, 1, 0.4));

      mat4.rotateZ(m, m, 1);
